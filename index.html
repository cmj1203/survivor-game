<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>서바이버 게임</title>
  <style>
    /* ===== 꾸미기 (화면 배경, 게임오버 창, 레벨업 창) ===== */
    body {
      margin: 0;
      background: #111;            /* 페이지 전체 배경: 거의 검정 */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      color: #fff;
    }
    canvas {
      background: #1e1e2e;          /* 게임 도화지 배경: 어두운 남색 */
      display: block;
    }
    /* 팝업 창 공통: 평소엔 숨겨두고(display:none) 필요할 때 보여줌(flex) */
    .popup {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px 40px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #fff;
      border-radius: 8px;
      text-align: center;
    }
    .popup h1 { margin: 0; font-size: 32px; }
    #restart {
      padding: 10px 24px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #4a90e2;
      color: #fff;
    }
    #restart:hover { background: #357abd; }

    /* 레벨업 카드 (3~5장): 세로로 쌓임 */
    #choices { display: flex; flex-direction: column; gap: 8px; width: 320px; }
    .card {
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid #4a90e2;
      border-radius: 6px;
      background: #1e1e2e;
      color: #fff;
      text-align: left;
    }
    .card:hover { background: #2e3a55; }
    .card small { display: block; color: #aaa; margin-top: 4px; font-size: 13px; }
    .card.weapon-new { border-color: #ffd60a; }     /* 새 무기 카드는 노란 테두리 */
  </style>
</head>
<body>
  <!-- 게임이 그려지는 도화지 -->
  <canvas id="game" width="800" height="600"></canvas>

  <!-- 게임오버 창 (체력이 0이 되면 나타남) -->
  <div id="gameover" class="popup">
    <h1>게임 오버</h1>
    <p id="result"></p>
    <button id="restart">다시 시작</button>
  </div>

  <!-- 레벨업 창 (경험치가 차면 나타남, 카드 3장 중 하나 선택) -->
  <div id="levelup" class="popup">
    <h1>레벨 업!</h1>
    <p id="levelText"></p>
    <div id="choices"></div>
  </div>

  <script>
    // =====================================================================
    // 1. 준비물: 도화지, 붓, 화면 요소 가져오기
    // =====================================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");          // ctx = 도형을 그리는 붓
    const gameoverBox = document.getElementById("gameover");
    const resultText = document.getElementById("result");
    const restartBtn = document.getElementById("restart");
    const levelupBox = document.getElementById("levelup");
    const levelText = document.getElementById("levelText");
    const choicesBox = document.getElementById("choices");

    const W = canvas.width;    // 도화지 가로 (800)
    const H = canvas.height;   // 도화지 세로 (600)

    // =====================================================================
    // 2. 게임 규칙 숫자들 (여기 값만 바꿔도 난이도 조절 가능)
    //    ※ 강화로 바뀌는 값은 "기본값"이고, 실제로는 player 안의 값을 씀
    // =====================================================================
    const PLAYER_SPEED = 220;        // 플레이어 기본 속도 (1초에 몇 픽셀)
    const PLAYER_RADIUS = 14;        // 플레이어 원의 반지름
    const PLAYER_MAX_HP = 100;       // 기본 최대 체력
    const HIT_DAMAGE = 10;           // 적에게 닿으면 깎이는 체력
    const INVINCIBLE_TIME = 0.5;     // 맞은 뒤 무적 시간 (초)

    const ENEMY_SPEED = 60;          // 적 속도
    const ENEMY_RADIUS = 12;         // 적 원의 반지름
    const ENEMY_HP = 2;              // 적 체력
    const SPAWN_START = 1.0;         // 처음 적 생성 간격 (초)
    const SPAWN_MIN = 0.3;           // 최소 생성 간격 (초)

    const BULLET_SPEED = 450;        // 기본 탄환 속도
    const BULLET_RADIUS = 4;         // 기본 탄환 반지름

    // --- 경험치 / 레벨 ---
    const GEM_RADIUS = 6;            // 경험치 구슬 크기
    const PICKUP_RADIUS = 40;        // 구슬을 빨아들이는 거리 (기본값)
    const XP_PER_GEM = 1;            // 구슬 하나당 경험치
    const XP_BASE = 5;               // 1레벨 → 2레벨 필요 경험치
    const XP_GROWTH = 3;             // 레벨마다 늘어나는 필요 경험치
    const WEAPON_MAX_LEVEL = 5;      // 무기 최대 레벨
    const GEM_PULL_SPEED = 150;      // 구슬이 끌려오기 시작할 때 속도 (px/초)
    const GEM_PULL_ACCEL = 900;      // 끌려오는 구슬이 1초마다 빨라지는 양
    const MAGNET_MAX = 2;            // 자석 카드를 고를 수 있는 최대 횟수
    const START_CHOICES = 3;         // 레벨업 카드 수 (처음)
    const MAX_CHOICES = 5;           // 레벨업 카드 수 (최대)

    // =====================================================================
    // 2-1. 무기 목록 (새 무기를 추가하려면 여기에 항목 하나 더)
    //   name        : 카드에 보이는 이름
    //   interval    : 발동 간격 (초). 0이면 "항상 켜짐"
    //   upgradeDesc : 강화 카드 설명
    //   fire(w)     : 간격마다 한 번 실행 (탄환 쏘기 등)
    //   update(w,dt): 매 프레임 실행 (회전 구체처럼 계속 움직이는 것)
    //   draw(w)     : 화면에 그리기 (플레이어에 붙어 있는 무기용)
    //   w.level     : 이 무기의 현재 레벨 (1~5)
    // =====================================================================
    const WEAPONS = {
      // --- 기본 탄환: 가장 가까운 적에게 발사, 레벨 = 발사 개수 ---
      bullet: {
        name: "기본 탄환",
        interval: 0.5,
        upgradeDesc: "발사 개수 +1",
        fire(w) {
          const target = findNearestEnemy();
          if (!target) return;
          const baseAngle = Math.atan2(target.y - player.y, target.x - player.x);
          const count = w.level;
          const spread = 0.2;                       // 발사체 사이 각도 (라디안, 약 11도)
          for (let i = 0; i < count; i++) {
            // 여러 발이면 가운데를 기준으로 좌우로 벌림
            const angle = baseAngle + (i - (count - 1) / 2) * spread;
            bullets.push({
              kind: "bullet",
              x: player.x, y: player.y,
              vx: Math.cos(angle) * BULLET_SPEED,
              vy: Math.sin(angle) * BULLET_SPEED,
              r: BULLET_RADIUS,
              damage: player.damage,
            });
          }
        },
      },

      // --- 회전 구체: 플레이어 주위를 도는 공, 레벨 = 구체 개수 ---
      orb: {
        name: "회전 구체",
        interval: 0,
        upgradeDesc: "구체 +1개",
        orbitRadius: 60,       // 플레이어와의 거리
        orbRadius: 8,          // 구체 크기
        rotateSpeed: 3,        // 1초에 도는 각도 (라디안)
        hitCooldown: 0.4,      // 같은 적을 다시 때리기까지 시간
        update(w, dt) {
          w.angle = (w.angle || 0) + this.rotateSpeed * dt;
          for (const pos of this.positions(w)) {
            for (const e of enemies) {
              if (e.dead || (e.cd.orb || 0) > 0) continue;
              if (circlesTouch({ x: pos.x, y: pos.y, r: this.orbRadius }, e)) {
                damageEnemy(e, player.damage);
                e.cd.orb = this.hitCooldown;
              }
            }
          }
        },
        // 구체들의 현재 위치 (360도를 개수만큼 균등 분할)
        positions(w) {
          const list = [];
          for (let i = 0; i < w.level; i++) {
            const a = (w.angle || 0) + (Math.PI * 2 * i) / w.level;
            list.push({ x: player.x + Math.cos(a) * this.orbitRadius,
                        y: player.y + Math.sin(a) * this.orbitRadius });
          }
          return list;
        },
        draw(w) {
          ctx.fillStyle = "#a8dadc";
          for (const pos of this.positions(w)) {
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, this.orbRadius, 0, Math.PI * 2);
            ctx.fill();
          }
        },
      },

      // --- 관통 창: 직선으로 날아가며 적을 뚫고 지나감, 레벨↑ = 발사 간격↓ ---
      spear: {
        name: "관통 창",
        interval: 2.0,
        upgradeDesc: "발사 간격 -25%",
        getInterval(w) { return this.interval * Math.pow(0.75, w.level - 1); },
        fire(w) {
          const target = findNearestEnemy();
          if (!target) return;
          const dx = target.x - player.x, dy = target.y - player.y;
          const len = Math.hypot(dx, dy) || 1;
          bullets.push({
            kind: "spear",
            x: player.x, y: player.y,
            vx: (dx / len) * 600, vy: (dy / len) * 600,
            r: 6,
            damage: player.damage + 1,
            hitIds: new Set(),        // 이미 때린 적 번호 (같은 적 두 번 안 때림)
          });
        },
      },

      // --- 번개 오라: 플레이어 주변 원 안의 적에게 주기적으로 피해, 레벨↑ = 반경↑ ---
      aura: {
        name: "번개 오라",
        interval: 0.5,
        upgradeDesc: "범위 +20",
        getRadius(w) { return 60 + 20 * (w.level - 1); },
        fire(w) {
          const r = this.getRadius(w);
          for (const e of enemies) {
            if (!e.dead && Math.hypot(e.x - player.x, e.y - player.y) < r + e.r) {
              damageEnemy(e, player.damage);
            }
          }
          w.flash = 0.15;   // 번쩍이는 연출용 (초)
        },
        update(w, dt) { if (w.flash > 0) w.flash -= dt; },
        draw(w) {
          ctx.fillStyle = w.flash > 0 ? "rgba(190, 120, 255, 0.35)" : "rgba(190, 120, 255, 0.12)";
          ctx.beginPath();
          ctx.arc(player.x, player.y, this.getRadius(w), 0, Math.PI * 2);
          ctx.fill();
        },
      },

      // --- 폭탄: 적이 가장 몰린 곳으로 날아가 범위 폭발, 레벨↑ = 폭발 반경↑ ---
      bomb: {
        name: "폭탄",
        interval: 3.0,
        upgradeDesc: "폭발 반경 +25%",
        getRadius(w) { return 60 * Math.pow(1.25, w.level - 1); },
        fire(w) {
          const target = findCrowdedEnemy();
          if (!target) return;
          const dx = target.x - player.x, dy = target.y - player.y;
          const len = Math.hypot(dx, dy) || 1;
          bullets.push({
            kind: "bomb",
            x: player.x, y: player.y,
            vx: (dx / len) * 300, vy: (dy / len) * 300,
            r: 7,
            targetX: target.x, targetY: target.y,   // 여기 도착하면 폭발
            explodeRadius: this.getRadius(w),
            damage: player.damage + 1,
          });
        },
      },
    };

    // =====================================================================
    // 2-2. 능력치 강화 카드 목록 (무기가 아닌 플레이어 자체 강화)
    //   canPick(p) 가 있으면, 그게 true일 때만 카드 후보에 들어감 (횟수 제한용)
    // =====================================================================
    const UPGRADES = [
      { name: "빠른 공격", desc: "모든 무기 발동 간격 -20%", apply: (p) => { p.attackSpeed *= 0.8; } },
      { name: "빠른 발",   desc: "이동 속도 +15%",           apply: (p) => { p.speed *= 1.15; } },
      { name: "강한 공격", desc: "모든 무기 피해 +1",         apply: (p) => { p.damage += 1; } },
      { name: "자석",      desc: "구슬을 끌어당기는 범위 +30 (최대 2번)",
        canPick: (p) => p.magnetCount < MAGNET_MAX,          // 2번 고르면 더 안 나옴
        apply: (p) => { p.pickupRadius += 30; p.magnetCount += 1; } },
      { name: "튼튼함",    desc: "최대 체력 +20, 체력 전부 회복", apply: (p) => { p.maxHp += 20; p.hp = p.maxHp; } },
      { name: "선택의 폭", desc: "레벨업 카드 +1장 (최대 5장)",
        canPick: (p) => p.choices < MAX_CHOICES,             // 5장이 되면 더 안 나옴
        apply: (p) => { p.choices += 1; } },
    ];

    // =====================================================================
    // 3. 게임이 기억해야 할 것들 (상태)
    // =====================================================================
    let player;        // 플레이어 정보 (위치, 체력, 레벨, 무기 등)
    let enemies;       // 적 목록
    let bullets;       // 발사체 목록 (탄환, 창, 폭탄 모두 여기)
    let gems;          // 경험치 구슬 목록
    let effects;       // 폭발 같은 잠깐 보이는 연출 목록
    let stats;         // 생존 시간, 처치 수
    let state;         // "playing", "levelup", "gameover"
    let spawnTimer;    // 다음 적 생성까지 남은 시간
    let lastTime;      // 이전 프레임 시각 (dt 계산용)
    let nextEnemyId;   // 적마다 붙이는 고유 번호

    const keys = {};   // 지금 눌려 있는 키 목록. 예: keys["w"] === true

    // =====================================================================
    // 4. 처음 상태로 되돌리기 (시작할 때 + 재시작할 때 호출)
    // =====================================================================
    function resetGame() {
      player = {
        x: W / 2,                 // 화면 한가운데에서 시작
        y: H / 2,
        r: PLAYER_RADIUS,
        hp: PLAYER_MAX_HP,
        maxHp: PLAYER_MAX_HP,
        invincible: 0,            // 남은 무적 시간
        // --- 강화로 바뀌는 값들 ---
        speed: PLAYER_SPEED,
        damage: 1,
        attackSpeed: 1,           // 발동 간격에 곱함 (작을수록 빠름)
        pickupRadius: PICKUP_RADIUS,
        magnetCount: 0,           // 자석 카드를 고른 횟수
        choices: START_CHOICES,   // 레벨업 때 나오는 카드 수
        // --- 레벨 ---
        level: 1,
        xp: 0,
        xpNeed: XP_BASE,
        // --- 무기: 시작은 기본 탄환만 ---
        weapons: [{ type: "bullet", level: 1, timer: 0 }],
      };
      enemies = [];
      bullets = [];
      gems = [];
      effects = [];
      stats = { time: 0, kills: 0 };
      state = "playing";
      spawnTimer = SPAWN_START;
      lastTime = null;
      nextEnemyId = 1;

      gameoverBox.style.display = "none";   // 팝업 창 숨기기
      levelupBox.style.display = "none";
      requestAnimationFrame(gameLoop);      // 게임 루프 시작
    }

    // =====================================================================
    // 5. 키보드 입력 기억하기
    // =====================================================================
    window.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;
      // 방향키를 누르면 페이지가 스크롤되는 걸 막음
      if (["arrowup", "arrowdown", "arrowleft", "arrowright"].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });
    window.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // =====================================================================
    // 6. 적 만들기: 화면 바깥 가장자리 아무 곳에서 등장
    // =====================================================================
    function spawnEnemy() {
      const margin = 30;                          // 화면 밖으로 얼마나 떨어져서 나올지
      const side = Math.floor(Math.random() * 4); // 0=위, 1=아래, 2=왼쪽, 3=오른쪽
      let x, y;

      if (side === 0)      { x = Math.random() * W; y = -margin; }
      else if (side === 1) { x = Math.random() * W; y = H + margin; }
      else if (side === 2) { x = -margin;           y = Math.random() * H; }
      else                 { x = W + margin;        y = Math.random() * H; }

      enemies.push({ id: nextEnemyId++, x, y, r: ENEMY_RADIUS, hp: ENEMY_HP, cd: {} });
    }

    // 경험치 구슬 떨어뜨리기 (적이 죽은 자리에)
    function spawnGem(x, y) {
      gems.push({ x, y, r: GEM_RADIUS });
    }

    // 적에게 피해 주기. 죽으면 처치 수 +1, 구슬 떨어뜨림 (모든 무기가 이 함수를 씀)
    function damageEnemy(e, dmg) {
      if (e.dead) return;
      e.hp -= dmg;
      if (e.hp <= 0) {
        e.dead = true;
        stats.kills += 1;
        spawnGem(e.x, e.y);
      }
    }

    // =====================================================================
    // 7. 목표 찾기
    // =====================================================================
    // 가장 가까운 적
    function findNearestEnemy() {
      let nearest = null;
      let nearestDist = Infinity;

      for (const e of enemies) {
        if (e.dead) continue;
        const dx = e.x - player.x;
        const dy = e.y - player.y;
        const dist = dx * dx + dy * dy;   // 제곱근은 생략해도 비교에는 문제 없음
        if (dist < nearestDist) {
          nearestDist = dist;
          nearest = e;
        }
      }
      return nearest;
    }

    // 주변(반경 80)에 적이 가장 많이 모인 적 (폭탄 목표용)
    function findCrowdedEnemy() {
      let best = null;
      let bestCount = -1;
      for (const e of enemies) {
        if (e.dead) continue;
        let count = 0;
        for (const other of enemies) {
          if (!other.dead && Math.hypot(other.x - e.x, other.y - e.y) < 80) count++;
        }
        if (count > bestCount) { bestCount = count; best = e; }
      }
      return best;
    }

    // =====================================================================
    // 8. 무기 발동: 매 프레임 모든 무기의 타이머를 돌림
    // =====================================================================
    function updateWeapons(dt) {
      for (const w of player.weapons) {
        const def = WEAPONS[w.type];

        // 매 프레임 실행되는 것 (회전 구체 움직임 등)
        if (def.update) def.update(w, dt);

        // 간격마다 실행되는 것 (탄환, 창, 오라, 폭탄)
        if (def.fire && def.interval > 0) {
          w.timer -= dt;
          if (w.timer <= 0) {
            def.fire(w);
            const base = def.getInterval ? def.getInterval(w) : def.interval;
            w.timer = base * player.attackSpeed;
          }
        }
      }
    }

    // =====================================================================
    // 9. 두 원이 닿았는지 검사 (충돌 판정)
    // =====================================================================
    function circlesTouch(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy) < a.r + b.r;
    }

    // =====================================================================
    // 10. 한 프레임 동안 세상을 움직이기 (dt = 지난 프레임 이후 흐른 초)
    // =====================================================================
    function update(dt) {
      stats.time += dt;

      // --- 플레이어 이동 ---
      let mx = 0, my = 0;
      if (keys["w"] || keys["arrowup"])    my -= 1;
      if (keys["s"] || keys["arrowdown"])  my += 1;
      if (keys["a"] || keys["arrowleft"])  mx -= 1;
      if (keys["d"] || keys["arrowright"]) mx += 1;

      if (mx !== 0 || my !== 0) {
        // 대각선일 때 속도가 빨라지지 않게 길이를 1로 맞춤
        const len = Math.hypot(mx, my);
        player.x += (mx / len) * player.speed * dt;
        player.y += (my / len) * player.speed * dt;
      }
      // 화면 밖으로 못 나가게 가둠
      player.x = Math.max(player.r, Math.min(W - player.r, player.x));
      player.y = Math.max(player.r, Math.min(H - player.r, player.y));

      // 무적 시간 줄이기
      if (player.invincible > 0) player.invincible -= dt;

      // --- 적 생성 (시간이 갈수록 간격이 짧아짐) ---
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        // 60초 동안 서서히 SPAWN_START → SPAWN_MIN 으로 줄어듦
        const progress = Math.min(stats.time / 60, 1);
        spawnTimer = SPAWN_START - (SPAWN_START - SPAWN_MIN) * progress;
      }

      // --- 적 이동: 플레이어 쪽으로 + 무기별 재타격 대기시간 줄이기 ---
      for (const e of enemies) {
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const len = Math.hypot(dx, dy) || 1;
        e.x += (dx / len) * ENEMY_SPEED * dt;
        e.y += (dy / len) * ENEMY_SPEED * dt;
        for (const k in e.cd) if (e.cd[k] > 0) e.cd[k] -= dt;
      }

      // --- 무기 발동 ---
      updateWeapons(dt);

      // --- 발사체 이동 ---
      for (const b of bullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        // 폭탄: 목표 지점에 도착했으면 폭발
        if (b.kind === "bomb") {
          const remain = Math.hypot(b.targetX - b.x, b.targetY - b.y);
          if (remain < 8) {
            for (const e of enemies) {
              if (Math.hypot(e.x - b.x, e.y - b.y) < b.explodeRadius + e.r) damageEnemy(e, b.damage);
            }
            effects.push({ x: b.x, y: b.y, r: b.explodeRadius, life: 0.3, maxLife: 0.3 });
            b.dead = true;
          }
        }
      }
      // 화면 밖으로 나간 발사체 제거
      bullets = bullets.filter((b) => !b.dead && b.x > -40 && b.x < W + 40 && b.y > -40 && b.y < H + 40);

      // --- 충돌: 발사체 ↔ 적 ---
      for (const b of bullets) {
        if (b.kind === "bomb") continue;             // 폭탄은 닿아도 안 터지고 목표까지 감
        for (const e of enemies) {
          if (e.dead || !circlesTouch(b, e)) continue;

          if (b.kind === "spear") {
            // 관통: 같은 적은 한 번만 때리고 계속 날아감
            if (b.hitIds.has(e.id)) continue;
            b.hitIds.add(e.id);
            damageEnemy(e, b.damage);
          } else {
            // 기본 탄환: 적 하나 맞고 사라짐
            damageEnemy(e, b.damage);
            b.dead = true;
            break;
          }
        }
      }
      bullets = bullets.filter((b) => !b.dead);
      enemies = enemies.filter((e) => !e.dead);

      // --- 폭발 연출 시간 줄이기 ---
      for (const f of effects) f.life -= dt;
      effects = effects.filter((f) => f.life > 0);

      // --- 충돌: 적 ↔ 플레이어 ---
      if (player.invincible <= 0) {
        for (const e of enemies) {
          if (circlesTouch(e, player)) {
            player.hp -= HIT_DAMAGE;
            player.invincible = INVINCIBLE_TIME;
            break;               // 한 프레임에 한 번만 맞음
          }
        }
      }

      // --- 구슬 끌어당기기 + 줍기 ---
      const pickupArea = { x: player.x, y: player.y, r: player.pickupRadius };
      for (const g of gems) {
        // 매 프레임 "지금 범위 안인지"를 새로 판정
        if (circlesTouch(pickupArea, g)) {
          // 범위 안: 플레이어 쪽으로 이동, 점점 빨라짐 (막 들어왔으면 시작 속도부터)
          g.speed = (g.speed || GEM_PULL_SPEED) + GEM_PULL_ACCEL * dt;
          const dx = player.x - g.x;
          const dy = player.y - g.y;
          const len = Math.hypot(dx, dy) || 1;
          const move = Math.min(g.speed * dt, len);   // 플레이어를 지나쳐 가지 않게
          g.x += (dx / len) * move;
          g.y += (dy / len) * move;
        } else {
          g.speed = 0;   // 범위 밖: 그 자리에 멈춤 (다시 들어오면 처음 속도부터)
        }

        // 플레이어 몸에 닿으면 획득
        if (circlesTouch(player, g)) {
          g.dead = true;
          player.xp += XP_PER_GEM;
        }
      }
      gems = gems.filter((g) => !g.dead);

      // --- 게임오버 확인 ---
      if (player.hp <= 0) {
        player.hp = 0;
        gameOver();
        return;
      }

      // --- 레벨업 확인 (한 프레임에 한 번만) ---
      if (player.xp >= player.xpNeed) {
        levelUp();
      }
    }

    // =====================================================================
    // 11. 화면에 그리기
    // =====================================================================
    function draw() {
      ctx.clearRect(0, 0, W, H);   // 이전 프레임 지우기

      // 경험치 구슬 (초록 점, 끌려오는 중이면 밝은 초록)
      for (const g of gems) {
        ctx.fillStyle = g.speed > 0 ? "#7dffb0" : "#2ecc71";
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 폭발 연출 (주황 원이 점점 옅어짐)
      for (const f of effects) {
        ctx.fillStyle = `rgba(255, 140, 0, ${0.5 * (f.life / f.maxLife)})`;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 발사체 (종류별로 모양 다름)
      for (const b of bullets) {
        if (b.kind === "spear") {
          // 관통 창: 진행 방향으로 길쭉한 흰 선
          const len = Math.hypot(b.vx, b.vy) || 1;
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(b.x - (b.vx / len) * 15, b.y - (b.vy / len) * 15);
          ctx.lineTo(b.x + (b.vx / len) * 15, b.y + (b.vy / len) * 15);
          ctx.stroke();
        } else {
          ctx.fillStyle = b.kind === "bomb" ? "#ff8c00" : "#ffd60a";
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 적 (빨간 원)
      ctx.fillStyle = "#e63946";
      for (const e of enemies) {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 플레이어에 붙어 있는 무기 (오라, 회전 구체)
      for (const w of player.weapons) {
        const def = WEAPONS[w.type];
        if (def.draw) def.draw(w);
      }

      // 플레이어 (파란 원, 무적 중엔 깜빡임)
      const blink = player.invincible > 0 && Math.floor(player.invincible * 20) % 2 === 0;
      ctx.fillStyle = blink ? "#a8dadc" : "#4a90e2";
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fill();

      // 체력바 (왼쪽 위)
      const barW = 200, barH = 16, barX = 16, barY = 16;
      ctx.fillStyle = "#444";
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = "#2ecc71";
      ctx.fillRect(barX, barY, barW * (player.hp / player.maxHp), barH);
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1;
      ctx.strokeRect(barX, barY, barW, barH);

      // 경험치바 (체력바 아래, 파란색) + 레벨 표시
      const xpY = barY + barH + 6;
      ctx.fillStyle = "#444";
      ctx.fillRect(barX, xpY, barW, 10);
      ctx.fillStyle = "#4a90e2";
      ctx.fillRect(barX, xpY, barW * Math.min(player.xp / player.xpNeed, 1), 10);
      ctx.strokeRect(barX, xpY, barW, 10);
      ctx.fillStyle = "#fff";
      ctx.font = "14px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`Lv.${player.level}`, barX + barW + 8, xpY + 10);

      // 보유 무기 목록 (경험치바 아래, 작은 글씨)
      ctx.font = "12px sans-serif";
      ctx.fillStyle = "#ccc";
      const weaponLine = player.weapons.map((w) => `${WEAPONS[w.type].name} Lv${w.level}`).join(" · ");
      ctx.fillText(weaponLine, barX, xpY + 28);

      // 생존 시간, 처치 수 (오른쪽 위)
      ctx.fillStyle = "#fff";
      ctx.font = "18px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(`생존 시간: ${stats.time.toFixed(1)}초`, W - 16, 30);
      ctx.fillText(`처치: ${stats.kills}`, W - 16, 54);
      ctx.textAlign = "left";
    }

    // =====================================================================
    // 12. 게임 루프: 1초에 약 60번 update → draw 반복
    // =====================================================================
    function gameLoop(now) {
      if (state !== "playing") return;   // 게임오버·레벨업 중이면 멈춤

      // dt 계산: 첫 프레임은 0으로
      if (lastTime === null) lastTime = now;
      let dt = (now - lastTime) / 1000;
      lastTime = now;
      if (dt > 0.1) dt = 0.1;   // 탭 전환 등으로 시간이 크게 뛰면 최대 0.1초로 제한

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);   // 다음 프레임 예약
    }

    // 멈췄던 게임 다시 돌리기 (레벨업 카드 고른 뒤)
    function resumeGame() {
      for (const k in keys) keys[k] = false;   // 창 떠 있는 동안 눌린 키 초기화
      state = "playing";
      lastTime = null;                          // 멈춘 시간이 dt에 한꺼번에 들어오지 않게
      requestAnimationFrame(gameLoop);
    }

    // =====================================================================
    // 13. 레벨업: 게임을 멈추고 카드 보여주기 (기본 3장, '선택의 폭'으로 최대 5장)
    // =====================================================================
    function levelUp() {
      player.level += 1;
      player.xp -= player.xpNeed;
      player.xpNeed = XP_BASE + XP_GROWTH * (player.level - 1);
      state = "levelup";

      // 카드 후보 만들기: 능력치 강화 + 무기 카드
      const pool = [];
      for (const u of UPGRADES) {
        if (u.canPick && !u.canPick(player)) continue;   // 횟수 제한에 걸린 카드는 제외
        pool.push({ title: u.name, desc: u.desc, apply: () => u.apply(player) });
      }
      for (const type in WEAPONS) {
        const def = WEAPONS[type];
        const owned = player.weapons.find((w) => w.type === type);
        if (!owned) {
          pool.push({
            title: `새 무기: ${def.name}`,
            desc: "새로운 무기를 장착합니다",
            isNew: true,
            apply: () => player.weapons.push({ type, level: 1, timer: 0 }),
          });
        } else if (owned.level < WEAPON_MAX_LEVEL) {
          pool.push({
            title: `강화: ${def.name} Lv${owned.level} → Lv${owned.level + 1}`,
            desc: def.upgradeDesc,
            apply: () => { owned.level += 1; },
          });
        }
      }

      // 섞어서 앞에서부터 player.choices장 (기본 3장, 최대 5장)
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      const picks = pool.slice(0, player.choices);

      // 카드 버튼 만들기
      levelText.textContent = `Lv.${player.level} 도달! 하나를 고르세요`;
      choicesBox.innerHTML = "";
      for (const card of picks) {
        const btn = document.createElement("button");
        btn.className = "card" + (card.isNew ? " weapon-new" : "");
        btn.innerHTML = `${card.title}<small>${card.desc}</small>`;
        btn.addEventListener("click", () => {
          card.apply();
          levelupBox.style.display = "none";
          resumeGame();
        });
        choicesBox.appendChild(btn);
      }
      levelupBox.style.display = "flex";
    }

    // =====================================================================
    // 14. 게임오버 처리
    // =====================================================================
    function gameOver() {
      state = "gameover";
      resultText.textContent =
        `생존 시간 ${stats.time.toFixed(1)}초 · 처치 ${stats.kills}마리 · Lv.${player.level}`;
      gameoverBox.style.display = "flex";
    }

    restartBtn.addEventListener("click", resetGame);

    // =====================================================================
    // 15. 시작!
    // =====================================================================
    resetGame();
  </script>
</body>
</html>
