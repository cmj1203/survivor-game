      gameoverBox.style.display = "none";   // 팝업 창 숨기기
      levelupBox.style.display = "none";
      chestBox.style.display = "none";
      clearBox.style.display = "none";
      helpBox.style.display = "none";
      candyBox.style.display = "none";
      updateCamera();
      requestAnimationFrame(gameLoop);      // 게임 루프 시작
    }

    // =====================================================================
    // 5. 키보드 입력 기억하기
    // =====================================================================
    // WASD 는 "입력된 글자"가 아니라 "키보드에서의 위치"(e.code)로 알아냄
    //   → 한글 입력 상태(W 를 누르면 'ㅈ' 이 들어옴)나 Caps Lock 이 켜져 있어도 똑같이 동작
    const KEY_POSITIONS = { KeyW: "w", KeyA: "a", KeyS: "s", KeyD: "d", KeyH: "h" };

    function keyName(e) {
      return KEY_POSITIONS[e.code] || (e.key || "").toLowerCase();
    }

    window.addEventListener("keydown", (e) => {
      const name = keyName(e);
      if (name === "h" && !e.repeat) { toggleHelp(); return; }          // H: 도움말 열기/닫기
      if (name === "escape" && state === "help") { toggleHelp(); return; }
      // Cmd/Ctrl/Alt 와 함께 누른 키는 단축키이므로 무시
      //   → 맥은 Cmd 를 누른 채 누른 키의 "뗌" 신호를 안 보내서, 기억해 두면 영원히 눌린 걸로 남음
      if (e.metaKey || e.ctrlKey || e.altKey) {
        for (const k in keys) keys[k] = false;
        return;
      }
      keys[name] = true;
      // 방향키를 누르면 페이지가 스크롤되는 걸 막음
      if (["arrowup", "arrowdown", "arrowleft", "arrowright"].includes(name)) {
        e.preventDefault();
      }
    });
    window.addEventListener("keyup", (e) => {
      const name = keyName(e);
      // Cmd/Ctrl/Alt 를 떼는 순간에도 전부 초기화 (그 사이 놓친 "뗌" 신호 대비)
      if (["meta", "control", "alt"].includes(name)) {
        for (const k in keys) keys[k] = false;
        return;
      }
      keys[name] = false;
    });
    // 창을 벗어났다 돌아오면 "눌린 채로 남은 키"가 없게 초기화 (혼자 계속 걸어가는 것 방지)
    window.addEventListener("blur", () => {
      for (const k in keys) keys[k] = false;
    });

    // =====================================================================
    // 6. 적 만들기: 지금 보이는 화면의 바깥 가장자리 아무 곳에서 등장
    // =====================================================================
    function spawnEnemy() {
      const { x, y } = randomEdgePosition(30);    // 화면 밖 30px 지점 (맵 안쪽 변만)
      enemies.push(makeEnemy(pickEnemyType(), x, y));
    }

    // 지금 시각이 "몇 번째 몬스터 단계"인지 (0 = 박쥐만, 1 = 붉은 게까지, 2 = 거미까지 ... 5 = 박쥐 두 바퀴째 ...)
    //   WAVE_START_TIMES 시간표에서 이미 지난 칸의 수로 정해짐
    function enemyStage() {
      let stage = 0;
      while (stage + 1 < WAVE_START_TIMES.length && refTime() >= WAVE_START_TIMES[stage + 1]) stage += 1;
      return stage;
    }

    // 지금의 "주력" 적 종류 (마지막 종류가 끝나면 다시 처음부터)
    function currentEnemyType() {
      return ENEMY_TYPES[enemyStage() % ENEMY_TYPES.length];
    }

    // 이번에 나올 적 종류 고르기: 새 몬스터 비율은 레벨업 후 서서히 늘어나고, 나머지는 기존 몬스터
    function pickEnemyType() {
      const current = currentEnemyType();
      const stage = enemyStage();
      const unlocked = ENEMY_TYPES.slice(0, Math.min(stage + 1, ENEMY_TYPES.length));
      const olds = unlocked.filter((t) => t !== current);
      if (olds.length === 0) return current;             // 첫 단계: 박쥐뿐

      // 새 몬스터가 나올 확률 (레벨업 후 시간이 지날수록 커짐)
      if (Math.random() < newEnemyShare()) return current;

      // 기존 몬스터: 대부분은 바로 전 단계의 주력, 가끔 더 옛날 몬스터
      const len = ENEMY_TYPES.length;
      const prevMain = ENEMY_TYPES[(stage - 1 + len) % len];
      if (Math.random() < PREV_MAIN_CHANCE) return prevMain;
      return olds[Math.floor(Math.random() * olds.length)];
    }

    // 지금 새 몬스터가 차지하는 비율: 새 몬스터가 열린 직후 15% → 15초에 걸쳐 70% 로 서서히 증가
    function newEnemyShare() {
      const sinceUnlock = stats.time - player.stageChangedAt;
      const t = Math.max(0, Math.min(sinceUnlock / NEW_ENEMY_RAMP_TIME, 1));   // 0 → 1
      return NEW_ENEMY_SHARE_START + (NEW_ENEMY_SHARE_MAX - NEW_ENEMY_SHARE_START) * t;
    }

    // 적 하나 만들기: 종류 표의 값에 시간 보정을 곱함
    //   isChild = true 면 거미에서 갈라져 나온 새끼 거미
    function makeEnemy(type, x, y, isChild = false) {
      const minutes = refTime() / 60;                              // 지금까지 흐른 게임 시간 (분, 30분 기준으로 환산)
      const cycle = Math.floor(enemyStage() / ENEMY_TYPES.length);   // 몬스터 종류를 몇 바퀴 돌았는지
      const curse = curseLevel();                                  // 해골(패시브): 적이 더 튼튼하고 빠름
      const speedMul = Math.min(1 + ENEMY_SPEED_PER_MINUTE * minutes, ENEMY_SPEED_CAP) * (1 + P_CURSE_SPEED * curse);
      const lateMinutes = Math.max(0, refTime() - ENEMY_HP_TIME_START) / 60;
      const hpMul = DIFFICULTY * (1 + ENEMY_HP_PER_MINUTE_BASE * minutes) * (1 + ENEMY_HP_PER_MINUTE * lateMinutes) * (1 + P_CURSE_HP * curse);
      const damageMul = DIFFICULTY * Math.min(1 + ENEMY_DAMAGE_PER_MINUTE * minutes, ENEMY_DAMAGE_CAP);

      const e = {
        id: nextEnemyId++,
        type: type.key,
        x, y,
        shape: type.shape,
        color: type.color,
        behavior: type.behavior,
        r: type.r,
        speed: type.speed * speedMul,
        hp: Math.max(1, Math.round(type.hp * hpMul)),   // 반올림 (약한 적이 초반부터 2배로 튼튼해지지 않게)
        damage: Math.round(type.damage * damageMul),
        xp: type.xp * (cycle + 1),          // 한 바퀴 돌 때마다 경험치 2배, 3배...
        splitInto: type.splitInto || 0,
        cd: {},                             // 무기별 재타격 대기시간
      };
      e.maxHp = e.hp;

      if (isChild) {
        // 새끼 거미: 작고 약하지만 빠름, 더 이상 갈라지지 않음
        e.r = Math.round(type.r / 2);
        e.hp = Math.max(1, Math.round(1 * hpMul));
        e.speed *= 1.15;
        e.damage = Math.ceil(e.damage / 2);   // 새끼는 피해도 절반 (수가 많아서 몰려 죽기 쉬움)
        e.xp = 1 * (cycle + 1);
        e.splitInto = 0;
      }
      if (e.behavior === "boss")    { e.shootTimer = BOSS_SHOT_INTERVAL; e.summonTimer = BOSS_SUMMON_INTERVAL; }
      if (e.behavior === "charger") { e.mode = "walk"; e.modeTimer = CHARGER_WALK_TIME; }
      return e;
    }

    // 파편 뿌리기: (x, y)에서 count개가 사방으로 튀어 나감
    function spawnParticles(x, y, color, count, speed) {
      for (let i = 0; i < count; i++) {
        if (particles.length >= PARTICLE_MAX) return;    // 너무 많으면 더 안 만듦
        const angle = Math.random() * Math.PI * 2;
        const v = speed * (0.4 + Math.random() * 0.6);    // 파편마다 속도를 조금씩 다르게
        const life = 0.25 + Math.random() * 0.2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * v,
          vy: Math.sin(angle) * v,
          size: 2 + Math.random() * 2,
          color,
          life, maxLife: life,
        });
      }
    }

    // 엘리트 몬스터 등장: 지금의 주력 몬스터를 크고 강하게 만들어 화면 가장자리에서 내보냄
    function spawnElite() {
      const { x, y } = randomEdgePosition(50);
      const e = makeEnemy(currentEnemyType(), x, y);
      e.elite = true;
      e.r = Math.round(e.r * ELITE_SIZE);
      e.hp = Math.round(e.hp * ELITE_HP);
      e.damage = Math.round(e.damage * ELITE_DAMAGE);
      e.speed *= ELITE_SPEED;
      e.xp *= ELITE_XP;
      e.maxHp = e.hp;
      enemies.push(e);
      return e;
    }

    // 시간표의 한 칸이 실제로 시작되는 시각 (초): 게임 길이에 맞춰 줄이되, 첫 1분 안으로는 당겨지지 않게 함
    function eventTime(ev) { return Math.max(Math.min(ev.time, 60), ev.time * TIMELINE_SCALE); }

    // 몬스터 떼 등장: 화면 밖에서 출발해, 지금 플레이어가 있는 자리를 지나 반대편으로 날아감
    //   typeKey: 몬스터 종류 ("bat", "ghost")   angle: 날아가는 방향   count: 마릿수 (없으면 시간에 따라 늘어나는 기본값)
    function spawnSwarm(typeKey, angle, count) {
      const type = ENEMY_TYPES.find((t) => t.key === typeKey);
      const dirX = Math.cos(angle), dirY = Math.sin(angle);          // 날아가는 방향
      if (!count) count = Math.min(SWARM_COUNT_MAX, Math.round(SWARM_COUNT + SWARM_COUNT_PER_MINUTE * (refTime() / 60)));
      for (let i = 0; i < count; i++) {
        const back = SWARM_START_DISTANCE + Math.random() * SWARM_LENGTH;   // 뒤쪽으로 길게 늘어섬
        const side = (Math.random() - 0.5) * SWARM_WIDTH;                   // 좌우로 흩어짐
        const e = makeEnemy(type, player.x - dirX * back - dirY * side, player.y - dirY * back + dirX * side);
        e.behavior = "swarm";
        e.vx = dirX * SWARM_SPEED;
        e.vy = dirY * SWARM_SPEED;
        e.life = SWARM_LIFETIME;
        enemies.push(e);
      }
    }

    // 꽃 울타리 등장: 지금 플레이어 자리를 중심으로 식인꽃을 둥글게 심음
    //   꽃 수는 원둘레에 맞춰 자동 계산 (틈이 FLOWER_GAP 이 되게). 맵 밖(돌담)에 걸리는 자리는 건너뜀 → 거긴 돌담이 막아 줌
    //   MAX_ENEMIES 제한은 받지 않음 (한 송이라도 빠지면 울타리에 구멍이 나므로)
    function spawnFlowerRing(life = FLOWER_LIFETIME) {
      const cx = player.x, cy = player.y;
      const count = Math.floor((Math.PI * 2 * FLOWER_RING_RADIUS) / (FLOWER_TYPE.r * 2 + FLOWER_GAP));
      for (let i = 0; i < count; i++) {
        const a = (Math.PI * 2 * i) / count;
        const x = cx + Math.cos(a) * FLOWER_RING_RADIUS;
        const y = cy + Math.sin(a) * FLOWER_RING_RADIUS;
        if (x < WALL_SIZE || x > WORLD_W - WALL_SIZE || y < WALL_SIZE || y > WORLD_H - WALL_SIZE) continue;
        const e = makeEnemy(FLOWER_TYPE, x, y);
        e.speed = FLOWER_TYPE.speed;        // 조여 오는 속도는 레벨 보정 없이 고정 (빨라지면 피할 틈이 없음)
        e.ringX = cx; e.ringY = cy;         // 울타리의 중심 (플레이어를 따라오지 않고 이 자리로 조여 옴)
        e.life = life;
        e.wakeTimer = FLOWER_WAKE_TIME;
        enemies.push(e);
      }
    }

    // 마지막 보스 등장: 화면 밖에서 나타남. 시간·레벨 보정 없이 BOSS_TYPE 의 고정 능력치
    function spawnBoss() {
      const { x, y } = randomEdgePosition(80);
      boss = makeEnemy(BOSS_TYPE, x, y);
      boss.boss = true;
      boss.r = BOSS_TYPE.r; boss.hp = Math.round((BOSS_TYPE.hp + BOSS_HP_PER_LEVEL * player.level) * DIFFICULTY); boss.maxHp = boss.hp;
      boss.speed = BOSS_TYPE.speed; boss.damage = Math.round(BOSS_TYPE.damage * DIFFICULTY); boss.xp = 0;
      enemies.push(boss);
      spawnParticles(x, y, "#9b5de5", 30, 260);
      return boss;
    }

    // 경험치 구슬 떨어뜨리기 (적이 죽은 자리에). value = 이 구슬의 경험치
    function spawnGem(x, y, value = 1) {
      const r = GEM_RADIUS + (value >= 2 ? 2 : 0) + (value >= 4 ? 1 : 0);   // 값진 구슬은 조금 큼
      gems.push({ x, y, r, value });
    }

    // 보물 상자 떨어뜨리기
    //   realOnly = true 면 절대 미믹이 아님 (미믹을 잡고 받는 진짜 상자용)
    function spawnChest(x, y, realOnly = false) {
      // 맵 경계 밖에서 죽은 적이 떨어뜨려도 주울 수 있게 맵 안쪽으로 밀어 넣음
      const cx = Math.max(CHEST_RADIUS, Math.min(WORLD_W - CHEST_RADIUS, x));
      const cy = Math.max(CHEST_RADIUS, Math.min(WORLD_H - CHEST_RADIUS, y));
      const mimic = !realOnly && player.level >= MIMIC_MIN_LEVEL && Math.random() < MIMIC_CHANCE;
      chests.push({ x: cx, y: cy, r: CHEST_RADIUS, life: CHEST_LIFETIME, mimic, seed: Math.random() * 10 });
    }

    // 미믹 상자에 닿았을 때: 보상 대신 몬스터로 변함
    function wakeMimic(chest) {
      chest.dead = true;
      const e = makeEnemy(MIMIC_TYPE, chest.x, chest.y);
      e.wakeTimer = MIMIC_WAKE_TIME;       // 잠깐 제자리에서 번쩍이다가 덤벼듦 (도망칠 틈)
      enemies.push(e);
      floatTexts.push({ x: chest.x, y: chest.y - 20, text: "미믹!", color: "#ff1744", life: 1.2, maxLife: 1.2 });
      spawnParticles(chest.x, chest.y, "#ff1744", 10, 160);
    }

    // weight 가 있는 목록에서 하나 뽑기 (weight 가 클수록 잘 나옴)
    function pickWeighted(list) {
      const total = list.reduce((sum, r) => sum + r.weight, 0);
      let roll = Math.random() * total;
      for (const r of list) {
        roll -= r.weight;
        if (roll < 0) return r;
      }
      return list[0];
    }

    // 진화 조건: 무기가 최대 레벨이고, 짝이 되는 패시브도 최대 레벨
    function canEvolve(w) {
      const d = WEAPONS[w.type];
      if (!d.evolvesTo || w.level < WEAPON_MAX_LEVEL) return false;
      return passiveLevel(d.needs) >= PASSIVES[d.needs].maxLevel;
    }

    // 상자 열기: 게임을 멈추고, 가진 무기·능력을 1·3·5개 자동 강화한 뒤 룰렛 연출을 보여줌
    //   forcedCount 를 주면 그 개수만큼 강화 (테스트용)
    function openChest(chest, forcedCount) {
      chest.dead = true;
      state = "chest";
      effects.push({ kind: "chest", x: chest.x, y: chest.y, life: 0.8, maxLife: 0.8 });
      spawnParticles(chest.x, chest.y, "#ffd60a", 12, 160);

      // 강화는 여는 순간 바로 적용하고, 화면에는 룰렛이 끝난 뒤에 보여줌
      // 클로버(패시브): 3개·5개가 나올 비중이 행운만큼 커짐
      const counts = CHEST_COUNTS.map((c) => ({ count: c.count, weight: c.count > 1 ? c.weight * luckMul() : c.weight }));
      const count = forcedCount || pickWeighted(counts).count;
      const names = buildUpgradePool(false).map((u) => u.title);   // 룰렛에 돌아갈 이름들
      const gains = [];

      // 진화: 최대 레벨 무기 + 짝 패시브가 있으면 상자 하나당 하나씩 진화 (원작과 같음)
      const evolvable = player.weapons.find((w) => canEvolve(w));
      if (evolvable) {
        const from = WEAPONS[evolvable.type], to = WEAPONS[from.evolvesTo];
        evolvable.type = from.evolvesTo;
        evolvable.level = WEAPON_MAX_LEVEL;
        evolvable.timer = 0;
        gains.push({ title: `진화! ${from.name} → ${to.name}`, desc: to.desc, iconUrl: weaponIconUrl(evolvable.type), evolved: true });
        spawnParticles(player.x, player.y, "#ffd60a", 30, 240);
      }
      for (let i = gains.length; i < count; i++) {
        const pool = buildUpgradePool(false);        // 새 무기는 안 나옴. 가진 것만 강화
        if (pool.length === 0) break;
        const pick = pool[Math.floor(Math.random() * pool.length)];
        pick.apply();
        gains.push(pick);
      }
      if (gains.length === 0) {
        // 강화할 것이 하나도 없으면 체력을 전부 회복
        player.hp = player.maxHp;
        gains.push({ title: "체력 전부 회복", desc: "더 강화할 것이 없습니다" });
      }

      startChestRoll(names, gains);
      return gains;
    }

    // 룰렛 연출: 이름이 빠르게 바뀌다가 멈추고, 결과가 하나씩 나타난 뒤 '받기' 버튼이 켜짐
    function startChestRoll(names, gains) {
      cancelChestRoll();
      chestSlot.textContent = "";
      chestList.innerHTML = "";
      chestOk.disabled = true;
      chestBox.style.display = "flex";

      chestRoll = { gains, shown: 0, timers: [] };
      if (names.length === 0) names = ["?"];
      const spin = setInterval(() => {
        chestSlot.textContent = names[Math.floor(Math.random() * names.length)];
      }, 70);
      chestRoll.timers.push(spin);
      chestRoll.timers.push(setTimeout(() => {
        clearInterval(spin);
        chestSlot.textContent = `강화 ${gains.length}개!`;
        gains.forEach((g, i) => {
          chestRoll.timers.push(setTimeout(() => showChestGain(g), 250 * i));
        });
        chestRoll.timers.push(setTimeout(() => { chestOk.disabled = false; }, 250 * gains.length));
      }, CHEST_ROLL_TIME * 1000));
    }

    // 강화 결과 한 줄을 창에 추가
    function showChestGain(g) {
      const row = document.createElement("div");
      row.className = "gain" + (g.evolved ? " evolved" : "");
      row.innerHTML = `${g.title}<small>${g.desc}</small>`;
      setIcon(row, g.iconUrl);
      chestList.appendChild(row);
      if (chestRoll) chestRoll.shown += 1;
    }

    // 룰렛 연출을 건너뛰고 결과를 전부 보여줌 (테스트용 + 재시작 때 정리용)
    function finishChestRoll() {
      if (!chestRoll) return;
      for (const t of chestRoll.timers) { clearInterval(t); clearTimeout(t); }
      chestRoll.timers = [];
      chestSlot.textContent = `강화 ${chestRoll.gains.length}개!`;
      for (let i = chestRoll.shown; i < chestRoll.gains.length; i++) showChestGain(chestRoll.gains[i]);
      chestOk.disabled = false;
    }

    function cancelChestRoll() {
      if (chestRoll) for (const t of chestRoll.timers) { clearInterval(t); clearTimeout(t); }
      chestRoll = null;
    }

    // '받기' 버튼: 창을 닫고 게임 재개
    function closeChest() {
      if (state !== "chest" || chestOk.disabled) return;
      cancelChestRoll();
      chestBox.style.display = "none";
      resumeGame();
    }

    // ---------------------------------------------------------------------
    // 바닥 아이템 (물약)
    // ---------------------------------------------------------------------
    function spawnItem(x, y, forcedKey) {
      const type = ITEM_TYPES.find((t) => t.key === forcedKey) || pickWeighted(ITEM_TYPES);
      const ix = Math.max(ITEM_RADIUS, Math.min(WORLD_W - ITEM_RADIUS, x));
      const iy = Math.max(ITEM_RADIUS, Math.min(WORLD_H - ITEM_RADIUS, y));
      items.push({ x: ix, y: iy, r: ITEM_RADIUS, life: ITEM_LIFETIME, type });
    }

    // 아이템에 닿았을 때: 종류에 따라 바로 발동
    function useItem(item) {
      item.dead = true;
      const type = item.type;
      floatTexts.push({ x: item.x, y: item.y - 16, text: type.text, color: type.color, life: 1.4, maxLife: 1.4 });
      spawnParticles(item.x, item.y, type.color, 8, 140);

      if (type.key === "heal") {
        player.hp = Math.min(player.maxHp, player.hp + ITEM_HEAL);
      } else if (type.key === "magnet") {
        // 화면의 모든 구슬이 거리와 상관없이 끌려옴
        for (const g of gems) { g.magnet = true; g.speed = Math.max(g.speed || 0, 400); }
      } else if (type.key === "wipe") {
        // 화면의 적 전멸. 엘리트는 죽지 않고 최대 체력의 일부만 깎임
        for (const e of enemies) {
          damageEnemy(e, e.boss ? Math.ceil(e.maxHp * 0.1) : e.elite ? Math.ceil(e.maxHp * CROSS_ELITE_DAMAGE) : e.hp);
        }
        enemyBullets = [];
        effects.push({ x: player.x, y: player.y, r: Math.hypot(W, H), life: 0.35, maxLife: 0.35 });
      } else if (type.key === "freeze") {
        freezeTimer = FREEZE_TIME * durationMul();   // 주문서(패시브)로 더 길게
      }
    }

    // 레벨업에 필요한 경험치 (레벨이 높을수록 가파르게 늘어남)
    function xpNeedFor(level) {
      const n = level - 1;
      return XP_BASE + XP_GROWTH * n + XP_CURVE * n * n;
    }

    // 적에게 피해 주기. 죽으면 처치 수 +1, 구슬 떨어뜨림 (모든 무기가 이 함수를 씀)
    function damageEnemy(e, dmg) {
      if (e.dead) return;
      e.hp -= dmg;

      // 피격 이펙트: 흰색으로 번쩍 + 작은 불꽃
      e.hitFlash = HIT_FLASH_TIME;
      spawnParticles(e.x, e.y, "#ffffff", HIT_SPARKS, 120);

      if (e.hp <= 0) {
        e.dead = true;
        stats.kills += 1;
        if (e.boss) { gameClear(); return; }                                // 보스를 잡으면 클리어
        spawnGem(e.x, e.y, e.xp);
        if (e.type === "mimic") {
          spawnChest(e.x, e.y, true);                                  // 미믹을 잡으면 진짜 상자를 반드시 떨어뜨림
        } else if (e.elite) {
          spawnChest(e.x, e.y);                                        // 엘리트를 잡으면 상자를 반드시 떨어뜨림 (20레벨부터는 미믹일 수도)
        } else if (Math.random() < ITEM_DROP_CHANCE * luckMul()) {          // 클로버(패시브)가 있으면 더 자주
          spawnItem(e.x, e.y);                                         // 일반 몬스터: 낮은 확률로 바닥 아이템
        }

        // 처치 이펙트: 적 색깔 파편이 사방으로 퍼짐 + 바깥으로 퍼지는 고리
        spawnParticles(e.x, e.y, e.color, DEATH_PARTICLES, 180);
        effects.push({ kind: "ring", x: e.x, y: e.y, r: e.r, color: e.color, life: 0.25, maxLife: 0.25 });

        // 거미(분열): 죽은 자리 양옆에 작은 적이 갈라져 나옴
        // (적 목록을 도는 중일 수 있어서 바로 넣지 않고 pendingSpawns에 모아둠)
        for (let i = 0; i < e.splitInto; i++) {
          const angle = (Math.PI * 2 * i) / e.splitInto + Math.random();
          const type = ENEMY_TYPES.find((t) => t.key === e.type);
          pendingSpawns.push(makeEnemy(type, e.x + Math.cos(angle) * 14, e.y + Math.sin(angle) * 14, true));
        }
      }
    }

    // =====================================================================
    // 7. 목표 찾기
    // =====================================================================
    // 가장 가까운 적
    function findNearestEnemy() {
      // 보스전: 보스가 사정거리(BOSS_FOCUS_RANGE) 안에 있으면 부하보다 보스를 먼저 노림
      if (boss && !boss.dead && Math.hypot(boss.x - player.x, boss.y - player.y) < BOSS_FOCUS_RANGE) return boss;

      let nearest = null;
      let nearestDist = Infinity;

      for (const e of enemies) {
        if (e.dead) continue;
        const dx = e.x - player.x;
        const dy = e.y - player.y;
        const dist = dx * dx + dy * dy;   // 제곱근은 생략해도 비교에는 문제 없음
        if (dist < nearestDist) {
          nearestDist = dist;
          nearest = e;
        }
      }
      return nearest;
    }

    // 적 e 가 광선 줄 안에 들어 있는지 (가로줄이면 y, 세로줄이면 x 를 비교)
    function isInLine(e, line, half) {
      const offset = line.horizontal ? e.y - line.pos : e.x - line.pos;
      return Math.abs(offset) < half + e.r;
    }

    // 가로줄·세로줄 가운데 적이 가장 많이 걸리는 줄 찾기 (마법 지팡이 목표용)
    //   각 적의 위치를 줄의 중심 후보로 놓고, 그 줄에 걸리는 적 수를 세서 가장 많은 것을 고름
    function findBestLine(half) {
      const onScreen = enemies.filter((e) => !e.dead && inView(e.x, e.y));
      let best = null;
      for (const horizontal of [true, false]) {
        for (const center of onScreen) {
          const line = { horizontal, pos: horizontal ? center.y : center.x };
          let count = 0;
          for (const e of onScreen) if (isInLine(e, line, half)) count++;
          if (!best || count > best.count) best = { ...line, count };
        }
      }
      return best;
    }

    // =====================================================================
    // 8. 무기 발동: 매 프레임 모든 무기의 타이머를 돌림
    // =====================================================================
    function updateWeapons(dt) {
      for (const w of player.weapons) {
        const def = WEAPONS[w.type];

        // 매 프레임 실행되는 것 (회전 도끼 움직임, 보호막 재충전 등)
        if (def.update) def.update(w, dt);

        // 간격마다 실행되는 것 (탄환, 창, 오라, 폭탄)
        if (def.fire && def.interval > 0) {
          w.timer -= dt;
          if (w.timer <= 0) {
            fireWeapon(w, def);
            const base = def.getInterval ? def.getInterval(w) : def.interval;
            w.timer = base * player.attackSpeed;
            // 복제기(패시브): 발사 무기는 0.12초 간격으로 레벨만큼 한 번 더 발사 (noAmount 무기는 제외)
            if (!def.noAmount && extraAmount() > 0) {
              w.refire = [];
              for (let i = 1; i <= extraAmount(); i++) w.refire.push(0.12 * i);
            }
          }
        }
        // 복제기로 예약된 추가 발사
        if (w.refire && w.refire.length) {
          w.refire = w.refire.map((t) => t - dt);
          while (w.refire.length && w.refire[0] <= 0) { w.refire.shift(); fireWeapon(w, def); }
        }
      }
    }

    // 무기 한 번 발사 + 이번에 새로 생긴 발사체에 팔보호대(패시브) 속도 배수 적용
    function fireWeapon(w, def) {
      const before = bullets.length;
      def.fire(w);
      const m = projSpeedMul();
      if (m === 1) return;
      for (let i = before; i < bullets.length; i++) {
        const b = bullets[i];
        b.vx *= m; b.vy *= m;
        if (b.ax) { b.ax *= m; b.ay *= m; }
      }
    }

    // 무기 한 방의 피해 = (기본 공격력 + 무기 고유 보너스) × 무기 레벨 보정
    //   기본 공격력은 '강한 공격' 카드로, 레벨 보정은 그 무기를 강화할 때마다 +20%
    function weaponDamage(w, bonus = 0) {
      return (player.damage + bonus) * (1 + WEAPON_LEVEL_DAMAGE * (w.level - 1)) * damageMul() * ((WEAPONS[w.type] || {}).damageMul || 1);   // 힘(패시브) 배수 × 진화 배수
    }

    // 적을 (fromX, fromY) 반대쪽으로 power 픽셀만큼 밀어냄 (엘리트는 절반만)
    function pushEnemy(e, fromX, fromY, power) {
      if (e.boss) return;                                   // 보스는 밀리지 않음
      const dx = e.x - fromX, dy = e.y - fromY;
      const len = Math.hypot(dx, dy) || 1;
      const p = e.elite ? power * 0.5 : power;
      e.x += (dx / len) * p;
      e.y += (dy / len) * p;
    }

    // 플레이어가 피해를 입을 때 (적에게 닿음, 적 탄환에 맞음). 보호막이 켜져 있으면 대신 막아 줌
    function hurtPlayer(amount) {
      const shield = player.weapons.find((w) => (w.type === "shield" || w.type === "shield_evo") && w.ready);
      const victory = player.weapons.find((w) => w.type === "victory");
      if (victory) WEAPONS.victory.retaliate(victory);          // 승리의 검: 맞으면 반격
      if (shield) {
        WEAPONS[shield.type].breakShield(shield);
      } else {
        player.hp -= Math.max(1, amount - passiveLevel("armor"));   // 갑옷(패시브): 레벨당 -1, 최소 1
      }
      player.invincible = INVINCIBLE_TIME;   // 막았을 때도 잠깐 무적 (연달아 맞지 않게)
    }

    // =====================================================================
    // 9. 두 원이 닿았는지 검사 (충돌 판정)
    // =====================================================================
    function circlesTouch(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy) < a.r + b.r;
    }

    // =====================================================================
    // 10. 한 프레임 동안 세상을 움직이기 (dt = 지난 프레임 이후 흐른 초)
    // =====================================================================
    function update(dt) {
      stats.time += dt;

      // --- 플레이어 이동 ---
      let mx = 0, my = 0;
      if (keys["w"] || keys["arrowup"])    my -= 1;
      if (keys["s"] || keys["arrowdown"])  my += 1;
      if (keys["a"] || keys["arrowleft"])  mx -= 1;
      if (keys["d"] || keys["arrowright"]) mx += 1;

      if (mx !== 0) player.facingLeft = mx < 0;   // 마지막으로 움직인 좌우 방향을 바라봄
      if (mx !== 0 || my !== 0) {
        // 대각선일 때 속도가 빨라지지 않게 길이를 1로 맞춤
        const len = Math.hypot(mx, my);
        player.facingX = mx / len;                 // 바라보는 방향 기억
        player.facingY = my / len;
        player.x += (mx / len) * player.speed * dt;
        player.y += (my / len) * player.speed * dt;
      }
      // 식인꽃은 벽: 겹치면 플레이어를 꽃 바깥으로 밀어냄 (뚫고 지나갈 수 없음) + 닿은 값으로 피해
      for (const e of enemies) {
        if (e.behavior !== "ring" || e.dead) continue;
        const dx = player.x - e.x, dy = player.y - e.y;
        const dist = Math.hypot(dx, dy) || 1;
        const overlap = player.r + e.r - dist;
        if (overlap <= 0) continue;
        player.x += (dx / dist) * overlap;
        player.y += (dy / dist) * overlap;
        const harmless = e.wakeTimer > 0 || freezeTimer > 0 || e.frozenTimer > 0;
        if (player.invincible <= 0 && !harmless) hurtPlayer(e.damage);
      }
      // 맵 밖(돌담)으로 못 나가게 가둠 + 카메라가 따라옴
      player.x = Math.max(WALL_SIZE + player.r, Math.min(WORLD_W - WALL_SIZE - player.r, player.x));
      player.y = Math.max(WALL_SIZE + player.r, Math.min(WORLD_H - WALL_SIZE - player.r, player.y));
      updateCamera();

      // 무적 시간 줄이기
      if (player.invincible > 0) player.invincible -= dt;

      // 회복(패시브): 1초마다 레벨 × 0.2 만큼 체력 회복
      if (passiveLevel("regen") > 0 && player.hp < player.maxHp) {
        player.hp = Math.min(player.maxHp, player.hp + P_REGEN * passiveLevel("regen") * dt);
      }

      // --- 적 생성 (시간이 갈수록 간격이 짧아짐) ---
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        // 최소 간격에 도달한 뒤에는 한 번에 나오는 수가 계속 늘어남 (SPAWN_DOUBLE_TIME 마다 +1마리, 그 사이는 확률로)
        const extra = Math.max(0, (refTime() - SPAWN_RAMP_TIME) / SPAWN_DOUBLE_TIME);
        const burst = 1 + Math.floor(extra) + (Math.random() < extra % 1 ? 1 : 0);
        for (let i = 0; i < burst; i++) if (enemies.length < MAX_ENEMIES) spawnEnemy();

        // SPAWN_RAMP_TIME 초 동안 서서히 SPAWN_START → SPAWN_MIN 으로 줄어듦
        const progress = Math.min(refTime() / SPAWN_RAMP_TIME, 1);
        spawnTimer = (SPAWN_START - (SPAWN_START - SPAWN_MIN) * progress) / (1 + P_CURSE_SPAWN * curseLevel()) / DIFFICULTY;   // 해골: 더 자주
      }

      // --- 몬스터 시간표: 새 단계가 시작되는 순간, 새 몬스터가 서서히 늘어나기 시작 + 화면 위 안내 문구 ---
      const stage = enemyStage();
      if (stage !== player.enemyStage) {
        player.enemyStage = stage;
        player.stageChangedAt = stats.time;
        if (SHOW_BANNER) {
          const name = currentEnemyType().name;
          banner = { text: stage >= ENEMY_TYPES.length ? `더 강해진 적: ${name}` : `새로운 적: ${name}`, life: BANNER_TIME };   // 한 바퀴 돈 뒤에는 같은 종류가 더 강해져서 다시 나옴
        }
      }

      // --- 엘리트 등장 (1분마다). 보스가 나온 뒤에는 안 나옴 ---
      eliteTimer -= dt;
      if (eliteTimer <= 0) {
        if (!boss) spawnElite();
        eliteTimer = ELITE_INTERVAL;
      }

      // --- 이벤트 시간표 (몬스터 떼·꽃 울타리): 시각이 되면 확률을 굴려 시작하고, repeat 번을 delay 간격으로 내보냄 ---
      while (eventIndex < EVENT_SCHEDULE.length && stats.time >= eventTime(EVENT_SCHEDULE[eventIndex])) {
        const ev = EVENT_SCHEDULE[eventIndex++];
        if (stats.time - eventTime(ev) > 5) continue;                 // 이미 한참 지난 칸은 건너뜀
        if (Math.random() < (ev.chance ?? 1)) eventQueue.push({ ev, left: ev.repeat || 1, timer: 0, angle: Math.random() * Math.PI * 2 });
      }
      for (const q of eventQueue) {
        q.timer -= dt;
        if (q.timer > 0) continue;
        if (!boss) {
          if (q.ev.kind === "flower") spawnFlowerRing(q.ev.life);
          else spawnSwarm(q.ev.type, (q.ev.delay || 0) < 3 ? q.angle + (Math.random() - 0.5) * 0.25 : Math.random() * Math.PI * 2, q.ev.count);
        }
        q.left -= 1;
        q.timer = q.ev.delay || 0;
      }
      eventQueue = eventQueue.filter((q) => q.left > 0);

      // --- 마지막 보스: BOSS_TIME(20분)에 등장 (문구 없이 조용히. 화면 위 보스 체력바로 알 수 있음) ---
      if (!boss && stats.time >= BOSS_TIME) spawnBoss();

      // --- 빙결 시간 줄이기 (눈꽃 아이템) ---
      const frozen = freezeTimer > 0;
      if (frozen) freezeTimer -= dt;

      // --- 적 이동 (행동 방식별) + 무기별 재타격 대기시간 줄이기 ---
      for (const e of enemies) {
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const len = Math.hypot(dx, dy) || 1;
        const dirX = dx / len;    // 플레이어 쪽 방향 (길이 1)
        const dirY = dy / len;

        // 식인꽃·박쥐 떼: 수명이 다하면 사라짐 (구슬·처치 수 없음). 화면 안에서 사라질 때만 파편
        if (e.life !== undefined) {
          e.life -= dt;
          if (e.life <= 0) { e.dead = true; if (inView(e.x, e.y)) spawnParticles(e.x, e.y, e.color, 4, 90); continue; }
        }

        if ((frozen || e.frozenTimer > 0) && !e.boss) {
          // 빙결 중(눈꽃 아이템 전체 빙결, 또는 빙결 광선에 맞은 개별 빙결): 움직이지도, 쏘지도, 돌진하지도 않음
          if (e.frozenTimer > 0) e.frozenTimer -= dt;
        } else if (e.wakeTimer > 0) {
          // 막 정체를 드러낸 미믹: 잠깐 제자리에 있음
          e.wakeTimer -= dt;
        } else if (e.behavior === "boss") {
          // 사신 마법사: 플레이어를 계속 쫓아오며 5갈래 탄환을 쏘고, 주기적으로 부하를 소환
          e.x += dirX * e.speed * dt;
          e.y += dirY * e.speed * dt;
          e.shootTimer -= dt;
          if (e.shootTimer <= 0) {
            const base = Math.atan2(dirY, dirX);
            for (let i = 0; i < BOSS_SHOT_COUNT; i++) {
              const a = base + (i - (BOSS_SHOT_COUNT - 1) / 2) * 0.22;
              enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * BOSS_BULLET_SPEED, vy: Math.sin(a) * BOSS_BULLET_SPEED, r: ENEMY_BULLET_RADIUS, damage: Math.round(BOSS_BULLET_DAMAGE * DIFFICULTY) });
            }
            e.shootTimer = BOSS_SHOT_INTERVAL;
          }
          e.summonTimer -= dt;
          if (e.summonTimer <= 0) {
            for (let i = 0; i < BOSS_SUMMON_COUNT; i++) {
              const a = (Math.PI * 2 * i) / BOSS_SUMMON_COUNT;
              if (enemies.length < MAX_ENEMIES) pendingSpawns.push(makeEnemy(currentEnemyType(), e.x + Math.cos(a) * 70, e.y + Math.sin(a) * 70));
            }
            e.summonTimer = BOSS_SUMMON_INTERVAL;
            spawnParticles(e.x, e.y, "#9b5de5", 16, 200);
          }
        } else if (e.behavior === "charger") {
          // 붉은 게(돌진): 걷기(walk) → 멈춰서 번쩍(windup) → 돌진(dash) 반복
          e.modeTimer -= dt;
          if (e.mode === "walk") {
            e.x += dirX * e.speed * dt;
            e.y += dirY * e.speed * dt;
            if (e.modeTimer <= 0) {
              e.mode = "windup";
              e.modeTimer = CHARGER_WINDUP_TIME;
              e.dashX = dirX;       // 이 순간의 방향으로 돌진 (그 사이 피하면 빗나감)
              e.dashY = dirY;
            }
          } else if (e.mode === "windup") {
            if (e.modeTimer <= 0) { e.mode = "dash"; e.modeTimer = CHARGER_DASH_TIME; }
          } else {
            e.x += e.dashX * CHARGER_DASH_SPEED * dt;
            e.y += e.dashY * CHARGER_DASH_SPEED * dt;
            if (e.modeTimer <= 0) { e.mode = "walk"; e.modeTimer = CHARGER_WALK_TIME; }
          }
        } else if (e.behavior === "swarm") {
          // 박쥐 떼: 플레이어를 쫓지 않고 처음 정해진 방향으로 곧장 날아감
          e.x += e.vx * dt;
          e.y += e.vy * dt;
        } else if (e.behavior === "ring") {
          // 식인꽃(울타리): 플레이어가 아니라 울타리 중심 쪽으로 천천히 조여 오다가 FLOWER_MIN_RADIUS 에서 멈춤
          const rx = e.ringX - e.x, ry = e.ringY - e.y;
          const dist = Math.hypot(rx, ry);
          if (dist > FLOWER_MIN_RADIUS) {
            e.x += (rx / dist) * e.speed * dt;
            e.y += (ry / dist) * e.speed * dt;
          }
        } else {
          // 기본(chase): 플레이어 쪽으로 곧장
          e.x += dirX * e.speed * dt;
          e.y += dirY * e.speed * dt;
        }

        for (const k in e.cd) if (e.cd[k] > 0) e.cd[k] -= dt;
        if (e.hitFlash > 0) e.hitFlash -= dt;
      }

      // --- 무기 발동 ---
      updateWeapons(dt);

      // --- 발사체 이동 (속성에 따라: 중력, 되돌아오기, 튕김, 수명) ---
      for (const b of bullets) {
        if (b.life !== undefined) { b.life -= dt; if (b.life <= 0) { if (b.onExpire) b.onExpire(b); b.dead = true; continue; } }
        if (b.gravity) b.vy += b.gravity * dt;                           // 던지는 망치: 포물선
        if (b.ax !== undefined) {                                        // 던지는 방패: 되돌아옴
          b.vx += b.ax * dt;
          b.vy += b.ay * dt;
          // 방향이 뒤집히는 순간, 돌아오는 길에 다시 때릴 수 있게 맞은 목록을 비움
          if (!b.turned && b.vx * b.startDirX + b.vy * b.startDirY < 0) { b.turned = true; b.hitIds.clear(); }
        }
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        // 화면 가장자리에서 튕김 (마법 구슬, 튕기는 칼). 튕기면 맞은 목록을 비워서 같은 적을 다시 때릴 수 있음
        if (b.bounces > 0) {
          let bounced = false;
          if (b.x < cam.x + b.r && b.vx < 0) { b.x = cam.x + b.r; b.vx = -b.vx; bounced = true; }
          if (b.x > cam.x + W - b.r && b.vx > 0) { b.x = cam.x + W - b.r; b.vx = -b.vx; bounced = true; }
          if (b.y < cam.y + b.r && b.vy < 0) { b.y = cam.y + b.r; b.vy = -b.vy; bounced = true; }
          if (b.y > cam.y + H - b.r && b.vy > 0) { b.y = cam.y + H - b.r; b.vy = -b.vy; bounced = true; }
          if (bounced) { b.bounces -= 1; if (b.hitIds) b.hitIds.clear(); if (b.onBounce) b.onBounce(b); }
        }

        // 화염병: 목표 지점에 도착하면 바닥에 불바다
        if (b.kind === "bomb") {
          const remain = Math.hypot(b.targetX - b.x, b.targetY - b.y);
          if (remain < 8) {
            zones.push({ kind: "fire", x: b.x, y: b.y, r: b.zoneRadius, life: b.zoneLife, maxLife: b.zoneLife, tick: 0, interval: 0.25, damage: b.damage, follow: b.zoneFollow });
            effects.push({ x: b.x, y: b.y, r: b.zoneRadius * 0.8, life: 0.25, maxLife: 0.25, rgb: "255, 140, 40" });
            b.dead = true;
          }
        }
      }
      // 화면 밖으로 나간 발사체 제거 (여유는 발사체마다 다를 수 있음: 망치는 위로 높이 올라감)
      bullets = bullets.filter((b) => !b.dead && inView(b.x, b.y, b.margin || 40));

      // --- 충돌: 발사체 ↔ 적 ---
      for (const b of bullets) {
        if (b.noHit) continue;                       // 화염병은 닿아도 안 터지고 목표까지 감
        for (const e of enemies) {
          if (e.dead || !circlesTouch(b, e)) continue;
          if (b.hitIds) {
            if (b.hitIds.has(e.id)) continue;        // 관통 중 같은 적은 한 번만
            b.hitIds.add(e.id);
          }
          if (b.onHit) { b.onHit(b); break; }        // 닿으면 터지는 것 (폭탄)
          damageEnemy(e, b.damage);
          if (b.pierce > 0) {
            b.pierce -= 1;                           // 관통: 계속 날아감
          } else {
            b.dead = true;                           // 단검·마법탄: 적 하나 맞고 사라짐
            break;
          }
        }
      }
      bullets = bullets.filter((b) => !b.dead);

      // --- 바닥 지역(불바다): 안에 있는 적에게 주기적으로 피해 ---
      for (const z of zones) {
        z.life -= dt;
        z.tick -= dt;
        if (z.follow) {                                 // 진화한 불바다: 플레이어 쪽으로 천천히 따라옴
          const dx = player.x - z.x, dy = player.y - z.y, len = Math.hypot(dx, dy) || 1;
          if (len > 30) { z.x += (dx / len) * 60 * dt; z.y += (dy / len) * 60 * dt; }
        }
        if (z.tick <= 0) {
          z.tick = z.interval;
          for (const e of enemies) {
            if (!e.dead && Math.hypot(e.x - z.x, e.y - z.y) < z.r + e.r) damageEnemy(e, z.damage);
          }
        }
      }
      zones = zones.filter((z) => z.life > 0);

      enemies = enemies.filter((e) => !e.dead);
      enemies = enemies.filter((e) => !e.dead);
      if (pendingSpawns.length > 0) {          // 거미에서 갈라져 나온 새끼 합치기
        enemies = enemies.concat(pendingSpawns);
        pendingSpawns = [];
      }

      // --- 폭발·고리 연출 시간 줄이기 ---
      for (const f of effects) f.life -= dt;
      effects = effects.filter((f) => f.life > 0);

      // --- 파편 이동: 날아가면서 점점 느려지고 사라짐 ---
      for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.life -= dt;
      }
      particles = particles.filter((p) => p.life > 0);

      // --- 충돌: 적 ↔ 플레이어 ---
      if (player.invincible <= 0) {
        for (const e of enemies) {
          if (frozen && !e.boss) continue; // 빙결 중인 적은 닿아도 피해를 주지 않음 (보스는 안 얼음)
          if (e.wakeTimer > 0) continue;   // 깨어나는 중인 미믹은 아직 피해를 주지 않음
          if (circlesTouch(e, player)) {
            hurtPlayer(e.damage);
            break;               // 한 프레임에 한 번만 맞음
          }
        }
      }

      // --- 적 탄환: 이동 → 플레이어에 닿으면 피해 (무적 시간 규칙은 똑같이 적용) ---
      for (const b of enemyBullets) {
        if (frozen) continue;              // 빙결 중엔 적 탄환도 멈춤
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (circlesTouch(b, player)) {
          b.dead = true;
          if (player.invincible <= 0) hurtPlayer(b.damage);
        }
      }
      enemyBullets = enemyBullets.filter((b) => !b.dead && inView(b.x, b.y, 40));

      // --- 안내 문구 시간 줄이기 ---
      if (banner) {
        banner.life -= dt;
        if (banner.life <= 0) banner = null;
      }

      // --- 구슬 끌어당기기 + 줍기 ---
      const pickupArea = { x: player.x, y: player.y, r: player.pickupRadius };
      for (const g of gems) {
        // 매 프레임 "지금 범위 안인지"를 새로 판정 (상자의 자석 보상을 받은 구슬은 거리와 상관없이 끌려옴)
        if (g.magnet || circlesTouch(pickupArea, g)) {
          // 범위 안: 플레이어 쪽으로 이동, 점점 빨라짐 (막 들어왔으면 시작 속도부터)
          g.speed = (g.speed || GEM_PULL_SPEED) + GEM_PULL_ACCEL * dt;
          const dx = player.x - g.x;
          const dy = player.y - g.y;
          const len = Math.hypot(dx, dy) || 1;
          const move = Math.min(g.speed * dt, len);   // 플레이어를 지나쳐 가지 않게
          g.x += (dx / len) * move;
          g.y += (dy / len) * move;
        } else {
          g.speed = 0;   // 범위 밖: 그 자리에 멈춤 (다시 들어오면 처음 속도부터)
        }

        // 플레이어 몸에 닿으면 획득
        if (circlesTouch(player, g)) {
          g.dead = true;
          player.xp += g.value * xpMul();   // 왕관(패시브): 경험치 배수
        }
      }
      gems = gems.filter((g) => !g.dead);

      // --- 떠오르는 글씨: 위로 올라가며 사라짐 ---
      for (const f of floatTexts) { f.y -= 30 * dt; f.life -= dt; }
      floatTexts = floatTexts.filter((f) => f.life > 0);

      // --- 바닥 아이템: 시간이 지나면 사라지고, 몸이 닿으면 바로 발동 ---
      for (const it of items) {
        it.life -= dt;
        if (it.life <= 0) { it.dead = true; continue; }
        if (circlesTouch(player, it)) useItem(it);
      }
      items = items.filter((it) => !it.dead);

      // --- 보물 상자: 시간이 지나면 사라지고, 몸이 닿으면 열림 ---
      let openedChest = false;
      for (const c of chests) {
        c.life -= dt;
        if (c.life <= 0) { c.dead = true; continue; }
        if (!c.dead && circlesTouch(player, c)) {
          if (c.mimic) { wakeMimic(c); continue; }
          openChest(c);
          openedChest = true;              // 상자 창이 떴으니 이번 프레임은 여기까지
          break;
        }
      }
      chests = chests.filter((c) => !c.dead);

      // --- 게임오버 확인 (부활 패시브가 남아 있으면 대신 부활) ---
      if (player.hp <= 0) {
        if (player.revivesUsed < passiveLevel("revival")) {
          revivePlayer();
        } else {
          player.hp = 0;
          gameOver();
          return;
        }
      }

      // --- 레벨업 확인 (한 프레임에 한 번만) ---
      if (openedChest) return;             // 상자 창이 떠 있으면 레벨업은 창을 닫은 다음 프레임에
      if (player.xp >= player.xpNeed) {
        levelUp();
      }
    }

    // =====================================================================
    // 11. 화면에 그리기
    // =====================================================================
    function draw() {
      ctx.clearRect(0, 0, W, H);   // 이전 프레임 지우기

      // --- 여기부터는 월드 좌표: 카메라 위치만큼 옮겨서 그림 ---
      ctx.save();
      ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
      if (background) {
        // 던전 바닥: 맵 전체 그림에서 지금 화면에 보이는 부분만 잘라서 그림
        const sx = Math.round(cam.x), sy = Math.round(cam.y);
        ctx.drawImage(background, sx, sy, W, H, sx, sy, W, H);
      }

      // 바닥 지역: 불바다 (일렁이는 주황 원)
      for (const z of zones) {
        const t = z.life / z.maxLife;
        if (z.kind === "shadow") {
          // 그림자 발톱의 흔적: 어두운 보라 원
          ctx.fillStyle = `rgba(60, 30, 90, ${0.55 * t})`;
          ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();
          continue;
        }
        const flicker = 0.85 + Math.sin(stats.time * 18 + z.x) * 0.08;
        ctx.fillStyle = `rgba(255, 120, 30, ${0.30 * Math.min(1, t * 3)})`;
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.r * flicker, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255, 200, 80, ${0.35 * Math.min(1, t * 3)})`;
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.r * 0.55 * flicker, 0, Math.PI * 2);
        ctx.fill();
      }

      // 경험치 구슬 (초록 마름모 + 흰 테두리, 끌려오는 중이면 밝은 초록)
      for (const g of gems) {
        const s = g.r * 1.3;
        ctx.fillStyle = g.speed > 0 ? "#7dffb0" : "#2ecc71";
        ctx.strokeStyle = "#eafff2";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(g.x, g.y - s);
        ctx.lineTo(g.x + s * 0.75, g.y);
        ctx.lineTo(g.x, g.y + s);
        ctx.lineTo(g.x - s * 0.75, g.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // 바닥 아이템 (어두운 원판 + 그림. 사라지기 직전엔 깜빡임)
      //   경험치 구슬보다 나중에 그려서, 구슬 더미에 묻히지 않고 항상 위에 보이게 함 (보물 상자도 마찬가지)
      for (const it of items) {
        const blinkOff = it.life < CHEST_BLINK_TIME && Math.floor(it.life * 6) % 2 === 0;
        if (blinkOff) continue;
        ctx.fillStyle = "rgba(18, 14, 26, 0.88)";          // 어두운 원판: 밝은 구슬 더미 위에서도 그림이 또렷하게 보임
        ctx.strokeStyle = it.type.color;                   // 테두리는 아이템 색 (회복 초록, 자석 빨강, 전멸 흰색, 빙결 하늘색)
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.r * 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        if (!drawSprite(it.type.sprite, it.x, it.y, it.r * SPRITE_SCALE)) {
          ctx.fillStyle = it.type.color;                   // 그림이 없을 때: 색깔 원
          ctx.beginPath();
          ctx.arc(it.x, it.y, it.r * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 보물 상자 (금빛 테두리 원 위에 상자 그림. 사라지기 직전엔 깜빡임)
      for (const c of chests) {
        const blinkOff = c.life < CHEST_BLINK_TIME && Math.floor(c.life * 6) % 2 === 0;
        if (blinkOff) continue;
        ctx.fillStyle = "rgba(255, 214, 10, 0.18)";
        ctx.strokeStyle = "rgba(255, 214, 10, 0.8)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // 미믹 상자는 2.5초에 한 번씩 0.3초 동안 살짝 떨림 (눈썰미가 좋으면 구별 가능)
        let shake = 0;
        if (c.mimic) {
          const phase = (stats.time + c.seed) % 2.5;
          if (phase < 0.3) shake = Math.sin(phase * 70) * 1.5;
        }
        if (!drawSprite("chest", c.x + shake, c.y, c.r * SPRITE_SCALE)) {
          ctx.fillStyle = "#c8793f";                       // 그림이 없을 때: 갈색 네모
          ctx.fillRect(c.x - c.r, c.y - c.r * 0.7, c.r * 2, c.r * 1.4);
        }
      }

      // 연출: 폭발(주황 원이 점점 옅어짐) / 처치 고리(바깥으로 퍼지며 옅어짐)
      for (const f of effects) {
        const t = f.life / f.maxLife;          // 1 → 0 으로 줄어듦
        if (f.kind === "chest") {
          // 열린 상자가 잠깐 남았다가 옅어지며 사라짐
          ctx.globalAlpha = t;
          drawSprite("chest_open", f.x, f.y, CHEST_RADIUS * SPRITE_SCALE);
          ctx.globalAlpha = 1;
        } else if (f.kind === "slash") {
          // 검 휘두르기: 방향 앞쪽에 굵은 호(弧)
          ctx.globalAlpha = t;
          ctx.strokeStyle = "#e8fdff";
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r * (0.8 + 0.2 * (1 - t)), f.angle - 1.0, f.angle + 1.0);
          ctx.stroke();
          ctx.strokeStyle = "#7df9ff";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r * 0.7, f.angle - 0.8, f.angle + 0.8);
          ctx.stroke();
          ctx.globalAlpha = 1;
        } else if (f.kind === "bolt") {
          // 낙뢰: 위에서 내려오는 지그재그 + 바닥 원
          ctx.globalAlpha = t;
          ctx.strokeStyle = "#f0feff";
          ctx.lineWidth = 3;
          ctx.beginPath();
          let px = f.x, py = f.y - 220;
          ctx.moveTo(px, py);
          for (let i = 1; i <= 6; i++) {
            const ny = f.y - 220 + (220 * i) / 6;
            const nx = i === 6 ? f.x : f.x + Math.sin(f.seed * 40 + i * 2.3) * 18;
            ctx.lineTo(nx, ny);
          }
          ctx.stroke();
          ctx.fillStyle = "rgba(125, 249, 255, 0.35)";
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (f.kind === "flash") {
          // 별의 문양: 화면 전체가 하얗게 번쩍
          ctx.fillStyle = `rgba(255, 255, 255, ${0.6 * t})`;
          ctx.fillRect(cam.x, cam.y, W, H);
        } else if (f.kind === "star") {
          // 별의 문양: 오각별
          ctx.globalAlpha = t;
          ctx.strokeStyle = "#ffd60a";
          ctx.lineWidth = 3;
          ctx.beginPath();
          for (let i = 0; i <= 5; i++) {
            const a = -Math.PI / 2 + (i * 2 * Math.PI * 2) / 5;    // 꼭짓점을 두 칸씩 건너뛰면 별이 됨
            const px = f.x + Math.cos(a) * f.r, py = f.y + Math.sin(a) * f.r;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        } else if (f.kind === "cone") {
          // 화염 방사: 부채꼴 불길
          ctx.globalAlpha = t;
          ctx.fillStyle = "rgba(255, 140, 40, 0.5)";
          ctx.beginPath();
          ctx.moveTo(f.x, f.y);
          ctx.arc(f.x, f.y, f.len, f.angle - f.half, f.angle + f.half);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(255, 220, 120, 0.6)";
          ctx.beginPath();
          ctx.moveTo(f.x, f.y);
          ctx.arc(f.x, f.y, f.len * 0.6, f.angle - f.half * 0.5, f.angle + f.half * 0.5);
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (f.kind === "ray") {
          // 빙결 광선: 캐릭터에서 뻗어 나가는 하늘색 선
          ctx.globalAlpha = t;
          ctx.strokeStyle = "#7df9ff";
          ctx.lineWidth = f.half * 2;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(f.x, f.y);
          ctx.lineTo(f.x + Math.cos(f.angle) * f.len, f.y + Math.sin(f.angle) * f.len);
          ctx.stroke();
          ctx.strokeStyle = "#f0feff";
          ctx.lineWidth = f.half * 0.6;
          ctx.stroke();
          ctx.lineCap = "butt";
          ctx.globalAlpha = 1;
        } else if (f.kind === "beam") {
          // 마법 지팡이 광선: 화면을 가로지르는 하늘색 띠 + 가운데 흰 심. 시간이 지나며 가늘어지고 옅어짐
          const outer = f.half * (0.4 + 0.6 * t);
          const inner = outer * 0.35;
          for (const [halfWidth, color] of [[outer, `rgba(125, 249, 255, ${0.45 * t})`], [inner, `rgba(240, 254, 255, ${0.9 * t})`]]) {
            ctx.fillStyle = color;
            if (f.horizontal) ctx.fillRect(cam.x, f.pos - halfWidth, W, halfWidth * 2);
            else ctx.fillRect(f.pos - halfWidth, cam.y, halfWidth * 2, H);
          }
        } else if (f.kind === "ring") {
          ctx.globalAlpha = t;
          ctx.strokeStyle = f.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r + (1 - t) * 22, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        } else {
          ctx.fillStyle = `rgba(${f.rgb || "144, 224, 239"}, ${0.55 * t})`;   // 기본은 하늘색, 화염병은 주황색
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 발사체 (그림이 있으면 그림, 없으면 빛나는 구슬. 전부 꼬리가 붙어서 '내 공격'임을 표시)
      for (const b of bullets) {
        const heading = Math.atan2(b.vy, b.vx) + Math.PI / 2;   // 그림은 위쪽을 향해 그려져 있어서 90도 보정
        const color = b.color || "#7df9ff";

        // 꼬리: 날아온 방향으로 옅은 선
        const trailTime = b.kind === "spear" ? BULLET_TRAIL * 2.2 : BULLET_TRAIL * 1.4;
        ctx.globalAlpha = 0.4;
        ctx.strokeStyle = color;
        ctx.lineWidth = b.kind === "spear" ? 6 : 5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(b.x - b.vx * trailTime, b.y - b.vy * trailTime);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.lineCap = "butt";

        let drew = false;
        if (b.sprite) {
          // 그림: spin 이 있으면 빙글빙글, 없으면 날아가는 방향으로
          drew = drawSprite(b.sprite, b.x, b.y, b.size || 16, { angle: b.spin ? stats.time * b.spin : heading });
        }
        if (!drew) {
          // 빛나는 구슬 (마법탄, 화염구, 마법 구슬): 바깥 빛 + 밝은 속
          ctx.fillStyle = b.glow ? b.glow + "59" : "rgba(125, 249, 255, 0.35)";
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r * 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = b.color ? color : "#e8fdff";
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r * 0.85, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 적 (종류별로 모양·색이 다름)
      for (const e of enemies) drawEnemy(e);

      // 파편 (작은 네모, 시간이 지나면 옅어짐)
      for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      ctx.globalAlpha = 1;

      // 적 탄환 (빨간 점, 흰 테두리 — 빨강 = 위험)
      for (const b of enemyBullets) {
        ctx.fillStyle = "#ff1744";
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // 플레이어에 붙어 있는 무기 (오라, 회전 도끼, 지팡이, 보호막)
      for (const w of player.weapons) {
        const def = WEAPONS[w.type];
        if (def.draw) def.draw(w);
      }

      // 플레이어 (기사 그림, 무적 중엔 깜빡임)
      const blink = player.invincible > 0 && Math.floor(player.invincible * 20) % 2 === 0;
      const drewKnight = drawSprite("knight", player.x, player.y, player.r * SPRITE_SCALE, {
        flip: player.facingLeft,
        white: blink,                      // 무적 중엔 흰색으로 깜빡임
      });
      if (!drewKnight) {
        // 그림을 못 불러왔을 때: 예전처럼 파란 원
        ctx.fillStyle = blink ? "#a8dadc" : "#4a90e2";
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // 떠오르는 글씨 (상자 보상 이름)
      for (const f of floatTexts) {
        ctx.globalAlpha = Math.min(f.life / (f.maxLife * 0.5), 1);
        ctx.font = "bold 16px sans-serif";
        ctx.textAlign = "center";
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#000";
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x, f.y);
      }
      ctx.globalAlpha = 1;
      ctx.textAlign = "left";

      // 체력·경험치바 (캐릭터 머리 위를 따라다님)
      drawPlayerBars();

      ctx.restore();
      // --- 여기부터는 화면 좌표 (카메라와 상관없이 항상 같은 자리) ---

      if (vignetteLayer) ctx.drawImage(vignetteLayer, 0, 0);   // 화면 가장자리 어둡게

      // 보유한 무기·방어구 목록 (화면 오른쪽에 아이콘으로 세로 나열)
      drawOwnedList();

      // 화면 밖에 있는 보물 상자를 가리키는 화살표 (화면 가장자리에)
      drawChestArrows();

      // 보스 체력바 (화면 위 가운데, 보스가 살아 있는 동안)
      if (boss && !boss.dead) {
        const bw = 520, bh = 16, bx = (W - bw) / 2, by = 48;
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(bx - 4, by - 26, bw + 8, bh + 34);
        ctx.fillStyle = "#222";
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = "#c77dff";
        ctx.fillRect(bx, by, bw * Math.max(0, boss.hp / boss.maxHp), bh);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1;
        ctx.strokeRect(bx, by, bw, bh);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`${BOSS_TYPE.name}  ${Math.ceil(boss.hp)} / ${boss.maxHp}`, W / 2, by - 8);
        ctx.textAlign = "left";
      }

      // 안내 문구 (화면 위 가운데, 서서히 사라짐)
      if (banner) {
        ctx.fillStyle = `rgba(255, 214, 10, ${Math.min(banner.life, 1)})`;
        ctx.font = "bold 22px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(banner.text, W / 2, 90);
        ctx.textAlign = "left";
      }

    }

    // ---------------------------------------------------------------------
    // 픽셀아트 그림 그리기
    //   판정(맞는 범위)은 여전히 반지름 r 인 원이고, 그림은 그 위에 얹는 "겉모습"일 뿐
    // ---------------------------------------------------------------------
    const SPRITE_SCALE = 1.35;   // 그림 크기 = 반지름 × 이 값 × 2 (그림 가장자리에 여백이 있어서 조금 크게)

    // 보유한 무기·방어구를 화면 오른쪽에 아이콘으로 세로 나열 (얻은 순서대로)
    //   칸마다: 어두운 네모 + 무기 그림 + 오른쪽 아래에 레벨. 보호막은 재충전 중일 때 어둡게 덮이며 차오름
    function drawOwnedList() {
      const size = 40, gap = 6;
      const weaponX = W - 16 - size;             // 오른쪽 끝 열: 무기
      const passiveX = weaponX - size - gap;     // 그 왼쪽 열: 패시브 아이템
      drawSlotColumn(player.weapons, WEAPONS, weaponX, size, gap, (w) => w.level >= WEAPON_MAX_LEVEL);
      // 패시브: 슬롯을 차지하는 것 먼저, '선택의 폭'처럼 자리를 안 차지하는 것은 맨 아래
      const passives = [...player.passives].sort((a, b) => (PASSIVES[a.type].noSlot ? 1 : 0) - (PASSIVES[b.type].noSlot ? 1 : 0));
      drawSlotColumn(passives, PASSIVES, passiveX, size, gap, (p) => p.level >= PASSIVES[p.type].maxLevel);
      ctx.textAlign = "left";
    }

    // 화면 밖 보물 상자 안내: 상자 쪽 화면 가장자리에 작은 상자 그림 + 금색 화살표
    //   상자가 화면 안에 들어오면 사라짐. 상자가 사라지기 직전엔 화살표도 같이 깜빡임 (미믹도 똑같이 보임)
    const CHEST_ARROW_MARGIN = 48;       // 화면 가장자리에서 얼마나 안쪽에 그릴지
    function drawChestArrows() {
      for (const c of chests) {
        if (inView(c.x, c.y, c.r)) continue;
        if (c.life < CHEST_BLINK_TIME && Math.floor(c.life * 6) % 2 === 0) continue;

        // 화면 한가운데에서 상자 쪽으로 뻗은 선이 화면 가장자리(안쪽 여백)와 만나는 점
        const dx = c.x - cam.x - W / 2;
        const dy = c.y - cam.y - H / 2;
        const scale = Math.min((W / 2 - CHEST_ARROW_MARGIN) / (Math.abs(dx) || 1), (H / 2 - CHEST_ARROW_MARGIN) / (Math.abs(dy) || 1));
        let x = W / 2 + dx * scale;
        const y = H / 2 + dy * scale;
        const angle = Math.atan2(dy, dx);

        // 오른쪽 위 보유 아이콘 줄과 겹치면 그 왼쪽 옆으로, 왼쪽 위 ? 버튼과 겹치면 그 오른쪽 옆으로 비켜 그림
        const reach = 36;                                  // 원 + 세모가 차지하는 반경
        const slot = 40 + 6;                               // 보유 아이콘 한 칸 (크기 + 간격. drawOwnedList 와 같은 값)
        const iconsLeft = W - 16 - 40 - (player.passives.length > 0 ? slot : 0);
        const iconsBottom = 16 + Math.max(player.weapons.length, player.passives.length) * slot;
        if (x > iconsLeft - reach && y < iconsBottom + reach) x = iconsLeft - reach;
        if (x < 64 + reach && y < 60 + reach) x = 64 + reach;

        // 작은 상자 그림 (금빛 원 위에)
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.strokeStyle = "#ffd60a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        drawSprite("chest", x, y, 11);

        // 상자 방향을 가리키는 세모 (원 바깥쪽에 붙음)
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = "#ffd60a";
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(32, 0);
        ctx.lineTo(20, -8);
        ctx.lineTo(20, 8);
        ctx.closePath();
        ctx.stroke();
        ctx.fill();
        ctx.restore();
      }
    }

    // 보유 목록 한 열 그리기 (무기 열과 패시브 열이 같이 씀)
    //   list : 보유 항목 [{type, level, ...}]   defs : WEAPONS 또는 PASSIVES   isMax(item) : 최대 레벨이면 금색 테두리
    function drawSlotColumn(list, defs, x, size, gap, isMax) {
      list.forEach((item, i) => {
        const def = defs[item.type];
        const y = 16 + i * (size + gap);

        // 칸 배경
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.fillRect(x, y, size, size);

        // 그림
        const cx = x + size / 2, cy = y + size / 2;
        drawSprite(def.icon, cx, cy, 17);

        // 보호막 재충전 중: 위에서부터 어둡게 덮고, 찰수록 걷힘
        if (item.type === "shield" && defs === WEAPONS && item.ready === false) {
          const remain = Math.max(0, Math.min(1, item.recharge / def.getRecharge(item)));
          ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
          ctx.fillRect(x, y, size, size * remain);
        }

        // 테두리 (최대 레벨이면 금색)
        ctx.strokeStyle = def.evolved ? "#ff8c42" : isMax(item) ? "#ffd60a" : "rgba(255, 255, 255, 0.6)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, size, size);

        // 레벨 숫자 (오른쪽 아래)
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "right";
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#000";
        const label = def.evolved ? "MAX" : `Lv${item.level}`;
        ctx.strokeText(label, x + size - 3, y + size - 4);
        ctx.fillStyle = def.evolved ? "#ffd60a" : "#fff";
        ctx.fillText(label, x + size - 3, y + size - 4);
      });
    }

    // 캐릭터 머리 위 체력바(위) + 경험치바(아래)
    function drawPlayerBars() {
      const barW = 48;
      const hpH = 5;
      const xpH = 3;
      const x = Math.round(player.x - barW / 2);

      // 캐릭터(보호막 방울) 바로 위. 화면 맨 위에 붙어서 바가 잘릴 것 같으면 캐릭터 아래로 옮김
      let y = Math.round(player.y - player.r * 1.55 - 12);
      if (y < 4) y = Math.round(player.y + player.r * 1.55 + 6);

      // 체력바: 남은 체력에 따라 초록 → 노랑 → 빨강
      const hpRatio = Math.max(0, player.hp / player.maxHp);
      ctx.fillStyle = "#222";
      ctx.fillRect(x, y, barW, hpH);
      ctx.fillStyle = hpRatio > 0.5 ? "#2ecc71" : hpRatio > 0.25 ? "#ffd60a" : "#ff1744";
      ctx.fillRect(x, y, barW * hpRatio, hpH);

      // 경험치바 (파란색)
      const xpRatio = Math.min(player.xp / player.xpNeed, 1);
      ctx.fillStyle = "#222";
      ctx.fillRect(x, y + hpH + 1, barW, xpH);
      ctx.fillStyle = "#4a90e2";
      ctx.fillRect(x, y + hpH + 1, barW * xpRatio, xpH);

      // 두 바를 감싸는 검은 테두리
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 1;
      ctx.strokeRect(x - 0.5, y - 0.5, barW + 1, hpH + xpH + 2);
    }

    // 그림 하나 그리기. 그렸으면 true, 그림이 준비 안 됐으면 false
    //   half  : 그림 절반 크기 (가운데에서 가장자리까지)
    //   flip  : 좌우 뒤집기      white : 흰색 실루엣으로 그리기 (맞았을 때)
    //   angle : 돌리는 각도 (라디안). 무기 그림을 날아가는 방향으로 돌릴 때 씀
    function drawSprite(name, x, y, half, { flip = false, white = false, angle = 0 } = {}) {
      const sprite = SPRITES[name];
      if (!sprite || !sprite.ready) return false;
      const img = white ? sprite.white : sprite.normal;
      const size = Math.round(half * 2);

      ctx.save();
      ctx.translate(Math.round(x), Math.round(y));
      if (flip) ctx.scale(-1, 1);
      if (angle) ctx.rotate(angle);
      ctx.drawImage(img, -size / 2, -size / 2, size, size);
      ctx.restore();
      return true;
    }

    // 적 하나 그리기
    function drawEnemy(e) {
      // 붉은 게는 돌진 직전에 흰색으로 번쩍임 (피하라는 신호)
      const flashing = e.mode === "windup" && Math.floor(e.modeTimer * 16) % 2 === 0;
      const hit = e.hitFlash > 0;                       // 방금 맞았으면 흰색으로 번쩍
      const waking = e.wakeTimer > 0 && Math.floor(e.wakeTimer * 16) % 2 === 0;   // 막 깨어난 미믹
      const white = flashing || hit || waking;

      // 살아 있는 느낌: 위아래로 살짝 들썩임 (박쥐는 빠르게 파닥파닥)
      const bobSpeed = e.shape === "bat" ? 18 : 7;
      const bob = Math.sin(stats.time * bobSpeed + e.id) * e.r * 0.12;

      // 보스: 보라색 큰 고리
      if (e.boss) {
        ctx.fillStyle = "rgba(155, 93, 229, 0.18)";
        ctx.strokeStyle = "#c77dff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // 엘리트: 금색 고리로 표시 (잡으면 상자를 주는 몬스터)
      if (e.elite) {
        ctx.fillStyle = "rgba(255, 214, 10, 0.15)";
        ctx.strokeStyle = "#ffd60a";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r * 1.6, 0, Math.PI * 2);      // 그림보다 크게 그려야 가려지지 않음
        ctx.fill();
        ctx.stroke();
      }

      const drew = drawSprite(e.shape, e.x, e.y + bob, e.r * SPRITE_SCALE, {
        flip: e.behavior === "swarm" ? e.vx < 0 : player.x < e.x,   // 플레이어가 있는 쪽을 바라봄 (박쥐 떼는 날아가는 쪽)
        white,
      });

      // 빙결 중: 옅은 하늘색으로 덮음
      if (freezeTimer > 0 || e.frozenTimer > 0) {
        ctx.fillStyle = "rgba(125, 249, 255, 0.35)";
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 엘리트는 머리 위에 체력바 (얼마나 남았는지 알 수 있게)
      if (e.elite) {
        const w = e.r * 2, x = e.x - e.r, y = e.y - e.r * 1.6 - 10;
        ctx.fillStyle = "#222";
        ctx.fillRect(x, y, w, 4);
        ctx.fillStyle = "#ffd60a";
        ctx.fillRect(x, y, w * Math.max(0, e.hp / e.maxHp), 4);
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 1;
        ctx.strokeRect(x - 0.5, y - 0.5, w + 1, 5);
      }

      if (!drew) {
        // 그림을 못 불러왔을 때: 단색 원 + 검은 테두리
        ctx.fillStyle = white ? "#fff" : e.color;
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }

    // =====================================================================
    // 12. 게임 루프: 1초에 약 60번 update → draw 반복
    // =====================================================================
    function gameLoop(now) {
      if (state !== "playing") return;   // 게임오버·레벨업 중이면 멈춤

      // dt 계산: 첫 프레임은 0으로
      if (lastTime === null) lastTime = now;
      let dt = (now - lastTime) / 1000;
      lastTime = now;
      if (dt > 0.1) dt = 0.1;   // 탭 전환 등으로 시간이 크게 뛰면 최대 0.1초로 제한

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);   // 다음 프레임 예약
    }

    // 멈췄던 게임 다시 돌리기 (레벨업 카드 고른 뒤)
    function resumeGame() {
      for (const k in keys) keys[k] = false;   // 창 떠 있는 동안 눌린 키 초기화
      state = "playing";
      lastTime = null;                          // 멈춘 시간이 dt에 한꺼번에 들어오지 않게
      requestAnimationFrame(gameLoop);
    }

    // =====================================================================
    // 13. 레벨업: 게임을 멈추고 카드 보여주기 (기본 3장, '선택의 폭'으로 최대 5장)
    // =====================================================================
    function levelUp() {
      player.level += 1;
      player.xp -= player.xpNeed;
      player.xpNeed = xpNeedFor(player.level);

      showCards("레벨 업!", `Lv.${player.level} 도달!`, null);   // 새 몬스터는 레벨이 아니라 시간표로 열림 (update 의 '몬스터 시간표' 참고)
    }

    // 번개 오라는 그림 파일이 없어서, 보유 목록과 같은 번개 모양을 SVG 그림으로 만들어 씀
    // 무기 종류 → 카드에 넣을 그림 주소
    function weaponIconUrl(type) {
      const def = WEAPONS[type];
      return `assets/${def.icon}.png`;
    }

    // 패시브 종류 → 카드에 넣을 그림 주소
    function passiveIconUrl(key) {
      return `assets/${PASSIVES[key].icon}.png`;
    }

    // 카드·결과 줄에 그림 넣기 (그림이 없으면 빈칸으로 둠 → 글자 줄은 그대로 맞춰짐)
    function setIcon(element, iconUrl) {
      element.style.backgroundImage = iconUrl ? `url("${iconUrl}")` : "none";
    }

    // 강화 후보 목록 만들기 (레벨업 카드와 보물 상자가 같이 씀)
    //   includeNewWeapons = false 면 '새 무기'·'새 아이템'은 빼고, 이미 가진 무기·패시브 강화만 (보물 상자용)
    function buildUpgradePool(includeNewWeapons) {
      const pool = [];
      const passiveSlotsUsed = player.passives.filter((p) => !PASSIVES[p.type].noSlot).length;
      for (const key in PASSIVES) {
        const def = PASSIVES[key];
        const owned = player.passives.find((p) => p.type === key);
        if (!owned) {
          if (!includeNewWeapons) continue;                                   // 보물 상자에서는 새 아이템이 나오지 않음
          if (!def.noSlot && passiveSlotsUsed >= PASSIVE_MAX_SLOTS) continue;  // 패시브 슬롯이 다 찼으면 새 아이템 없음
          pool.push({
            title: `새 아이템: ${def.name}`,
            iconUrl: passiveIconUrl(key),
            desc: def.desc,
            isNew: true, isPassive: true,
            apply: () => gainPassive(key),
          });
        } else if (owned.level < def.maxLevel) {
          pool.push({
            title: `강화: ${def.name} Lv${owned.level} → Lv${owned.level + 1}`,
            iconUrl: passiveIconUrl(key),
            desc: def.desc,
            isPassive: true,
            apply: () => gainPassive(key),
          });
        }
      }
      // 사탕 상자 (원작 Candybox): 무기 슬롯이 남아 있으면 가끔 나오는 카드. 고르면 원하는 무기를 직접 선택
      if (includeNewWeapons && player.weapons.length < MAX_WEAPONS && candyChoices().length > 0) {
        pool.push({ title: "사탕 상자", desc: "원하는 무기를 직접 골라 장착합니다", iconUrl: "assets/chest.png", isNew: true, isCandy: true, apply: openCandyBox });
      }
      for (const type in WEAPONS) {
        const def = WEAPONS[type];
        if (def.evolved) continue;                 // 진화 무기는 카드로 나오지 않음 (상자에서 진화로만)
        const owned = player.weapons.find((w) => w.type === type);
        if (!owned) {
          if (!includeNewWeapons) continue;        // 보물 상자에서는 새 무기가 나오지 않음
          if (player.weapons.length >= MAX_WEAPONS) continue;   // 무기 슬롯이 다 찼으면 새 무기 없음
          if (player.weapons.some((w) => WEAPONS[w.type].evoOf === type)) continue;   // 이미 진화한 무기의 원본은 다시 안 나옴
          pool.push({
            title: `새 무기: ${def.name}`,
            iconUrl: weaponIconUrl(type),
            desc: def.desc,                            // 무기가 어떻게 공격하는지 한 줄 설명
            isNew: true,
            apply: () => player.weapons.push({ type, level: 1, timer: 0 }),
          });
        } else if (owned.level < WEAPON_MAX_LEVEL) {
          pool.push({
            title: `강화: ${def.name} Lv${owned.level} → Lv${owned.level + 1}`,
            iconUrl: weaponIconUrl(type),
            desc: def.upgradeDesc,
            apply: () => { owned.level += 1; },
          });
        }
      }
      return pool;
    }

    // 게임을 멈추고 강화 카드 창 띄우기
    //   bannerText : 카드를 고른 뒤 화면 위에 잠깐 띄울 문구 (없으면 null)
    function showCards(title, text, bannerText) {
      state = "levelup";
      const pool = buildUpgradePool(true);
      // 섞어서 앞에서부터 player.choices장 (기본 3장, 최대 5장)
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      let picks = pool.slice(0, player.choices);
      if (picks.length === 0) {
        // 무기·아이템이 전부 만렙이면 고를 게 없으므로 체력 회복 카드를 줌 (창이 비어 멈추는 것 방지)
        picks = [{ title: "체력 전부 회복", desc: "더 강화할 것이 없습니다", apply: () => { player.hp = player.maxHp; } }];
      }

      // 카드 버튼 만들기
      levelTitle.textContent = title;
      levelText.textContent = text;
      choicesBox.innerHTML = "";
      for (const card of picks) {
        const btn = document.createElement("button");
        btn.className = "card" + (card.isNew ? (card.isPassive ? " passive-new" : " weapon-new") : "");
        btn.innerHTML = `${card.title}<small>${card.desc}</small>`;
        setIcon(btn, card.iconUrl);           // 무기 카드면 왼쪽에 무기 그림
        btn.addEventListener("click", () => {
          card.apply();
          levelupBox.style.display = "none";
          if (SHOW_BANNER && bannerText) banner = { text: bannerText, life: BANNER_TIME };   // 재개 직후 화면 위에 잠깐 안내
          if (state === "candy") return;                  // 사탕 상자: 무기 고르기 창이 떠 있으므로 아직 재개하지 않음
          resumeGame();
        });
        choicesBox.appendChild(btn);
      }
      levelupBox.style.display = "flex";
    }

    // 부활(패시브): 체력 전부 회복, 잠깐 무적, 주변 적을 밀어냄
    function revivePlayer() {
      player.revivesUsed += 1;
      player.hp = player.maxHp;
      player.invincible = P_REVIVE_INVINCIBLE;
      for (const e of enemies) if (!e.dead && inView(e.x, e.y)) pushEnemy(e, player.x, player.y, 120);
      enemyBullets = [];
      effects.push({ x: player.x, y: player.y, r: Math.hypot(W, H) * 0.5, life: 0.5, maxLife: 0.5 });
      spawnParticles(player.x, player.y, "#ffd60a", 20, 220);
      floatTexts.push({ x: player.x, y: player.y - 34, text: "부활!", color: "#ffd60a", life: 1.5, maxLife: 1.5 });
    }

    // =====================================================================
    // 14. 게임오버 처리
    // =====================================================================
    function gameOver() {
      state = "gameover";
      resultText.textContent =
        `생존 시간 ${formatTime(stats.time)} · 처치 ${stats.kills}마리`;
      gameoverBox.style.display = "flex";
    }

    // 초 → "12분 34초"
    function formatTime(sec) {
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return m > 0 ? `${m}분 ${s}초` : `${s}초`;
    }

    // 클리어: 게임을 멈추고 결과 창
    function gameClear() {
      state = "clear";
      spawnParticles(player.x, player.y, "#ffd60a", 40, 260);
      clearText.innerHTML = `걸린 시간 ${formatTime(stats.time)} · 처치 ${stats.kills}마리 · Lv.${player.level}`;
      clearBox.style.display = "flex";
    }
    clearRestart.addEventListener("click", resetGame);

    // =====================================================================
    // 14-1. ? 도움말: 무기 조합(진화)표, 무기 설명, 아이템 설명. 열려 있는 동안 게임이 멈춤
    // =====================================================================
    let helpTab = "combo";
    let helpReturnState = "playing";   // 닫을 때 돌아갈 상태 (레벨업 창 위에서 열었으면 레벨업으로)

    function toggleHelp() {
      if (state === "help") {
        helpBox.style.display = "none";
        if (helpReturnState === "playing") resumeGame();
        else state = helpReturnState;
        return;
      }
      if (state === "gameover" || state === "clear" || state === "candy") return;
      helpReturnState = state;
      state = "help";
      renderHelp();
      helpBox.style.display = "flex";
    }

    function renderHelp() {
      for (const tab of document.querySelectorAll(".help-tab")) tab.classList.toggle("active", tab.dataset.tab === helpTab);
      helpList.innerHTML = "";
      if (helpTab === "combo") renderComboTab();
      else if (helpTab === "weapons") renderListTab(Object.keys(WEAPONS).filter((k) => !WEAPONS[k].evolved), WEAPONS, (k) => weaponIconUrl(k), (k) => player.weapons.find((w) => w.type === k || WEAPONS[w.type].evoOf === k));
      else renderListTab(Object.keys(PASSIVES), PASSIVES, (k) => passiveIconUrl(k), (k) => player.passives.find((p) => p.type === k));
    }

    // 조합표: [무기] + [패시브] → [진화 무기]. 가진 것은 밝게, 조건이 갖춰지면 금색, 이미 진화했으면 주황
    function renderComboTab() {
      for (const base in EVOLUTIONS) {
        const from = WEAPONS[base], to = WEAPONS[EVOLUTIONS[base].to], need = PASSIVES[EVOLUTIONS[base].needs];
        const ownedW = player.weapons.find((w) => w.type === base);
        const done = player.weapons.some((w) => w.type === EVOLUTIONS[base].to);
        const pLv = passiveLevel(EVOLUTIONS[base].needs), pMax = need.maxLevel;
        const hasP = pLv > 0;
        const ready = !done && ownedW && canEvolve(ownedW);
        const row = document.createElement("div");
        row.className = "combo" + (done ? " done" : ready ? " ready" : "");
        row.innerHTML =
          `<span class="piece${ownedW || done ? "" : " dim"}"><img src="${weaponIconUrl(base)}">${from.name}${ownedW ? ` Lv${ownedW.level}/${WEAPON_MAX_LEVEL}` : ` (Lv${WEAPON_MAX_LEVEL} 필요)`}</span>` +
          `<span class="arrow">+</span>` +
          `<span class="piece${hasP ? "" : " dim"}"><img src="${passiveIconUrl(EVOLUTIONS[base].needs)}">${need.name}${hasP ? ` Lv${pLv}/${pMax}` : ` (Lv${pMax} 필요)`}</span>` +
          `<span class="arrow">→</span>` +
          `<span class="piece result${done ? "" : " dim"}"><img src="${weaponIconUrl(EVOLUTIONS[base].to)}"><span>${to.name}<small>${to.desc}</small></span></span>` +
          (done ? `<span class="tag">진화 완료</span>` : ready ? `<span class="tag">다음 상자에서 진화!</span>` : "");
        helpList.appendChild(row);
      }
      const note = document.createElement("p");
      note.style.cssText = "margin: 6px 0 0; color: #aaa; font-size: 13px;";
      note.textContent = `무기와 짝이 되는 아이템을 둘 다 최대 레벨까지 올린 채 보물 상자를 열면 진화합니다. 진화한 무기는 더 강화되지 않습니다.`;
      helpList.appendChild(note);
    }

    // 무기·아이템 설명 목록
    function renderListTab(keys_, defs, iconOf, ownedOf) {
      for (const k of keys_) {
        const def = defs[k]; const owned = ownedOf(k);
        const row = document.createElement("div");
        row.className = "combo";
        row.innerHTML = `<span class="piece${owned ? "" : " dim"}" style="min-width: 200px"><img src="${iconOf(k)}">${def.name}${owned ? ` Lv${owned.level}` : ""}</span><span class="result" style="color:#ccc">${def.desc || def.upgradeDesc || ""}</span>`;
        helpList.appendChild(row);
      }
    }

    helpBtn.addEventListener("click", toggleHelp);
    helpClose.addEventListener("click", toggleHelp);
    for (const tab of document.querySelectorAll(".help-tab")) tab.addEventListener("click", () => { helpTab = tab.dataset.tab; renderHelp(); });

    // =====================================================================
    // 14-2. 사탕 상자: 원하는 무기를 직접 고르는 창 (레벨업 카드 '사탕 상자'를 고르면 뜸)
    // =====================================================================
    // 고를 수 있는 무기: 진화 무기가 아니고, 아직 없고, 그 진화형도 없는 것
    function candyChoices() {
      return Object.keys(WEAPONS).filter((k) => !WEAPONS[k].evolved && !player.weapons.some((w) => w.type === k || WEAPONS[w.type].evoOf === k));
    }

    function openCandyBox() {
      state = "candy";
      candyList.innerHTML = "";
      for (const k of candyChoices()) {
        const def = WEAPONS[k];
        const btn = document.createElement("button");
        btn.className = "card weapon-new";
        btn.innerHTML = `${def.name}<small>${def.desc || ""}</small>`;
        setIcon(btn, weaponIconUrl(k));
        btn.addEventListener("click", () => {
          player.weapons.push({ type: k, level: 1, timer: 0 });
          candyBox.style.display = "none";
          resumeGame();
        });
        candyList.appendChild(btn);
      }
      candyBox.style.display = "flex";
    }

    restartBtn.addEventListener("click", resetGame);
    chestOk.addEventListener("click", closeChest);

    // =====================================================================
    // 15. 시작!
    // =====================================================================
    resetGame();
  </script>
</body>
</html>
