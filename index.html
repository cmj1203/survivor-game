<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>서바이버 게임</title>
  <style>
    /* ===== 꾸미기 (화면 배경, 게임오버 창, 레벨업 창) ===== */
    body {
      margin: 0;
      background: #111;            /* 페이지 전체 배경: 거의 검정 */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      color: #fff;
    }
    canvas {
      background: #1e1e2e;          /* 게임 도화지 배경: 어두운 남색 (바닥 그림이 안 불러와졌을 때 보임) */
      display: block;
      /* 브라우저 창이 게임 화면보다 작을 때만, 비율을 유지한 채 줄어들게 함 */
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
    /* 팝업 창 공통: 평소엔 숨겨두고(display:none) 필요할 때 보여줌(flex) */
    .popup {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px 40px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #fff;
      border-radius: 8px;
      text-align: center;
    }
    .popup h1 { margin: 0; font-size: 32px; }
    #restart {
      padding: 10px 24px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #4a90e2;
      color: #fff;
    }
    #restart:hover { background: #357abd; }

    /* 레벨업 카드 (3~5장): 세로로 쌓임 */
    #choices { display: flex; flex-direction: column; gap: 8px; width: 320px; }
    .card {
      padding: 12px 16px 12px 72px;                   /* 왼쪽 72px 은 무기 그림 자리 */
      min-height: 60px;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid #4a90e2;
      border-radius: 6px;
      background-color: #1e1e2e;
      /* 무기 그림은 자바스크립트에서 background-image 로 넣음 (levelUp → showCards 참고) */
      background-repeat: no-repeat;
      background-position: 14px center;
      background-size: 44px 44px;
      image-rendering: pixelated;                     /* 픽셀아트를 키워도 뿌옇게 번지지 않게 */
      color: #fff;
      text-align: left;
    }
    .card:hover { background-color: #2e3a55; }
    .card small { display: block; color: #aaa; margin-top: 4px; font-size: 13px; }
    .card.weapon-new { border-color: #ffd60a; }     /* 새 무기 카드는 노란 테두리 */
    .card.passive-new { border-color: #2ecc71; }    /* 새 패시브 아이템 카드는 초록 테두리 */

    /* 보물 상자 창 */
    #chestBox { border-color: #ffd60a; min-width: 320px; }
    #clearBox { border-color: #ffd60a; }
    #clearBox h1 { color: #ffd60a; font-size: 40px; }
    #clearText { margin: 0; line-height: 1.7; }

    /* 게임 화면 틀: 안에 든 ? 버튼이 "브라우저 창"이 아니라 "게임 화면" 구석을 기준으로 놓이게 함 */
    #stage { position: relative; line-height: 0; }

    /* ? 버튼 (게임 화면 안 왼쪽 위 구석, 픽셀아트 그림) */
    #helpBtn {
      position: absolute; top: 12px; left: 16px; z-index: 10;
      width: 48px; height: 48px; padding: 0; border: 0; background: transparent;
      cursor: pointer;
    }
    #helpBtn img {
      width: 48px; height: 48px; display: block;
      image-rendering: pixelated;
      filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.8));
    }
    #helpBtn:hover img { filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.8)) brightness(1.3); }

    /* 도움말 창: 조합표 + 무기 설명 */
    #helpBox { width: 760px; max-height: 88vh; padding: 20px 28px; gap: 8px; z-index: 20; }   /* 레벨업·상자 창보다 위에 뜨게 */
    #helpBox h1 { font-size: 26px; }
    .help-tabs { display: flex; gap: 8px; }
    .help-tab { padding: 6px 16px; border: 2px solid #4a90e2; border-radius: 6px; background: #1e1e2e; color: #fff; cursor: pointer; font-size: 15px; }
    .help-tab.active { background: #4a90e2; }
    #helpList { width: 100%; overflow-y: auto; max-height: 62vh; display: flex; flex-direction: column; gap: 6px; text-align: left; }
    .combo {                                          /* 조합표 한 줄: [무기] + [패시브] → [진화] */
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px; border: 2px solid rgba(255,255,255,0.25); border-radius: 6px; background: #1e1e2e; font-size: 14px;
    }
    .combo .piece { display: flex; align-items: center; gap: 6px; min-width: 150px; }
    .combo .piece.dim { opacity: 0.35; }             /* 아직 없는 것은 흐리게 */
    .combo .piece img { width: 30px; height: 30px; image-rendering: pixelated; }
    .combo .arrow { color: #aaa; }
    .combo .result { flex: 1; }
    .combo .result small { display: block; color: #aaa; font-size: 12px; }
    .combo.ready { border-color: #ffd60a; }           /* 조건이 갖춰짐: 다음 상자에서 진화 */
    .combo.done { border-color: #ff8c42; }            /* 이미 진화함 */
    .combo .tag { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #ffd60a; color: #111; font-weight: bold; }
    .combo.done .tag { background: #ff8c42; }
    .help-close { align-self: center; }

    /* 사탕 상자: 무기 고르기 창 */
    #candyBox { width: 720px; max-height: 88vh; padding: 20px 28px; }
    #candyList { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; overflow-y: auto; max-height: 60vh; }
    #candyList .card { padding: 8px 10px 8px 52px; min-height: 48px; font-size: 14px; background-position: 8px center; background-size: 36px 36px; }
    #candyList .card small { font-size: 11px; }
    #chestSlot { margin: 0; font-size: 22px; font-weight: bold; color: #ffd60a; min-height: 30px; }   /* 룰렛 글씨 */
    #chestList { display: flex; flex-direction: column; gap: 6px; width: 320px; }
    .gain {                                           /* 강화 결과 한 줄 (왼쪽에 무기 그림) */
      padding: 8px 14px 8px 52px;
      min-height: 30px;
      background-repeat: no-repeat;
      background-position: 12px center;
      background-size: 30px 30px;
      image-rendering: pixelated;
      border: 2px solid #ffd60a;
      border-radius: 6px;
      background-color: #1e1e2e;
      text-align: left;
      font-size: 15px;
    }
    .gain small { display: block; color: #aaa; margin-top: 2px; font-size: 12px; }
    .gain.evolved { border-color: #ff8c42; background-color: #2a1a10; }   /* 진화 결과 줄은 주황 테두리 */
    .ok-button {
      padding: 10px 28px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #ffd60a;
      color: #111;
      font-weight: bold;
    }
    .ok-button:disabled { opacity: 0.35; cursor: default; }
  </style>
</head>
<body>
  <!-- 게임이 그려지는 도화지 -->
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <!-- ? 버튼: 무기 조합(진화)표와 무기 설명을 보여주는 도움말 (H 키로도 열림) -->
    <button id="helpBtn" title="도움말 (H)"><img src="assets/help.png" alt="?"></button>
  </div>

  <div id="helpBox" class="popup">
    <h1>도움말</h1>
    <div class="help-tabs">
      <button class="help-tab active" data-tab="combo">무기 조합 (진화)</button>
      <button class="help-tab" data-tab="weapons">무기 설명</button>
      <button class="help-tab" data-tab="passives">아이템 설명</button>
    </div>
    <div id="helpList"></div>
    <button id="helpClose" class="ok-button help-close">닫기 (H)</button>
  </div>

  <!-- 사탕 상자: 원하는 무기를 직접 고르는 창 -->
  <div id="candyBox" class="popup">
    <h1>사탕 상자</h1>
    <p>원하는 무기를 하나 고르세요</p>
    <div id="candyList"></div>
  </div>

  <!-- 게임오버 창 (체력이 0이 되면 나타남) -->
  <div id="gameover" class="popup">
    <h1>게임 오버</h1>
    <p id="result"></p>
    <button id="restart">다시 시작</button>
  </div>

  <!-- 클리어 창 (마지막 보스를 잡으면 나타남) -->
  <div id="clearBox" class="popup">
    <h1>클리어!</h1>
    <p id="clearText"></p>
    <button id="clearRestart" class="ok-button">다시 시작</button>
  </div>

  <!-- 레벨업 창 (경험치가 차면 나타남, 카드 3장 중 하나 선택) -->
  <!-- 보물 상자 창 (엘리트를 잡고 상자를 열면 나타남. 룰렛이 돈 뒤 강화 결과를 보여줌) -->
  <div id="chestBox" class="popup">
    <h1>보물 상자!</h1>
    <p id="chestSlot"></p>
    <div id="chestList"></div>
    <button id="chestOk" class="ok-button">받기</button>
  </div>

  <div id="levelup" class="popup">
    <h1 id="levelTitle">레벨 업!</h1>
    <p id="levelText"></p>
    <div id="choices"></div>
  </div>

  <script>
    // =====================================================================
    // 1. 준비물: 도화지, 붓, 화면 요소 가져오기
    // =====================================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");          // ctx = 도형을 그리는 붓
    const gameoverBox = document.getElementById("gameover");
    const resultText = document.getElementById("result");
    const restartBtn = document.getElementById("restart");
    const levelupBox = document.getElementById("levelup");
    const levelTitle = document.getElementById("levelTitle");
    const levelText = document.getElementById("levelText");
    const choicesBox = document.getElementById("choices");
    const chestBox = document.getElementById("chestBox");
    const chestSlot = document.getElementById("chestSlot");
    const chestList = document.getElementById("chestList");
    const chestOk = document.getElementById("chestOk");
    const clearBox = document.getElementById("clearBox");
    const clearText = document.getElementById("clearText");
    const clearRestart = document.getElementById("clearRestart");
    const helpBtn = document.getElementById("helpBtn");
    const helpBox = document.getElementById("helpBox");
    const helpList = document.getElementById("helpList");
    const helpClose = document.getElementById("helpClose");
    const candyBox = document.getElementById("candyBox");
    const candyList = document.getElementById("candyList");

    const W = canvas.width;    // 화면(도화지) 가로 (1280) ← 크기를 바꾸려면 위쪽 <canvas> 태그의 숫자를 고치면 됨
    const H = canvas.height;   // 화면(도화지) 세로 (720)

    // =====================================================================
    // 1-0. 큰 맵과 카메라
    //   맵(월드)은 화면보다 훨씬 크고, 카메라가 플레이어를 화면 가운데에 두고 따라다님
    //   → 게임 안의 모든 위치(플레이어, 적, 발사체 ...)는 "월드 좌표"이고,
    //     그릴 때만 카메라 위치만큼 옮겨서(ctx.translate) 화면에 보이는 부분을 그림
    // =====================================================================
    const WORLD_W = 3840;      // 맵 가로 (화면의 3배)
    const WORLD_H = 2160;      // 맵 세로 (화면의 3배)
    const WALL_SIZE = 48;      // 맵 경계 돌담 두께 (장식용. 실제로 못 나가게 막는 건 좌표 제한)

    const cam = { x: 0, y: 0 };   // 카메라 왼쪽 위 모서리의 월드 좌표

    // 카메라를 플레이어 가운데로. 맵 가장자리에서는 멈춰서 맵 밖(검은 곳)이 안 보이게
    function updateCamera() {
      cam.x = Math.max(0, Math.min(WORLD_W - W, player.x - W / 2));
      cam.y = Math.max(0, Math.min(WORLD_H - H, player.y - H / 2));
    }

    // (x, y) 가 지금 화면(카메라 사각형) 안에 있는지. margin 만큼 여유를 둠
    function inView(x, y, margin = 0) {
      return x > cam.x - margin && x < cam.x + W + margin && y > cam.y - margin && y < cam.y + H + margin;
    }

    // 화면(카메라 사각형) 바깥 가장자리의 무작위 위치 (적·엘리트 생성용)
    //   맵 경계 밖은 안 되므로, 맵 안에 들어오는 변만 골라서 씀
    function randomEdgePosition(margin) {
      const candidates = [
        { x: cam.x + Math.random() * W, y: cam.y - margin },          // 위
        { x: cam.x + Math.random() * W, y: cam.y + H + margin },      // 아래
        { x: cam.x - margin,            y: cam.y + Math.random() * H },// 왼쪽
        { x: cam.x + W + margin,        y: cam.y + Math.random() * H },// 오른쪽
      ].filter((p) => p.x >= 0 && p.x <= WORLD_W && p.y >= 0 && p.y <= WORLD_H);
      if (candidates.length === 0) return { x: cam.x + Math.random() * W, y: cam.y - margin };   // 맵이 화면보다 작을 때 (안 생김)
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    // =====================================================================
    // 1-1. 픽셀아트 그림 불러오기 (assets 폴더, Kenney "Tiny Dungeon" CC0)
    //   SPRITES.ghost.normal = 원래 그림,  SPRITES.ghost.white = 흰색 실루엣 (맞았을 때 번쩍임용)
    //   그림이 아직 안 불러와졌거나 파일이 없으면 ready 가 false → 대신 단색 원으로 그림
    // =====================================================================
    const SPRITE_NAMES = ["knight", "ghost", "bat", "cyclops", "spider", "wizard", "crab", "flower", "chest", "chest_open", "mimic", "potion_green", "item_magnet", "item_wipe", "item_freeze",
                          "dagger", "axe", "spear", "firebomb", "staff", "shield",
                          "hammer", "shield_throw", "cleaver", "wand", "sword", "rock", "rock2", "bigsword",
                          "w_aura", "w_firewand", "w_rune", "w_lightning", "w_pentagram", "w_clock", "w_bracelet", "w_shadow", "w_petal", "w_flames", "w_bomb",
                          // 패시브 아이템 아이콘 (Kenney "1-Bit Pack" CC0)
                          "passive_might", "passive_armor", "passive_maxhp", "passive_regen", "passive_cooldown", "passive_area",
                          "passive_projspeed", "passive_duration", "passive_amount", "passive_move", "passive_magnet", "passive_luck",
                          "passive_growth", "passive_curse", "passive_revival", "passive_choices"];
    const SPRITES = {};
    for (const name of SPRITE_NAMES) {
      const sprite = { ready: false, normal: new Image(), white: null };
      sprite.normal.onload = () => {
        // 흰색 실루엣 만들기: 그림을 그린 뒤, 그림이 있는 부분만 흰색으로 덮음
        const c = document.createElement("canvas");
        c.width = sprite.normal.width;
        c.height = sprite.normal.height;
        const cctx = c.getContext("2d");
        cctx.drawImage(sprite.normal, 0, 0);
        cctx.globalCompositeOperation = "source-in";
        cctx.fillStyle = "#fff";
        cctx.fillRect(0, 0, c.width, c.height);
        sprite.white = c;
        sprite.ready = true;
      };
      sprite.normal.src = `assets/${name}.png`;
      SPRITES[name] = sprite;
    }
    ctx.imageSmoothingEnabled = false;   // 픽셀아트를 키워도 뿌옇게 번지지 않게

    // =====================================================================
    // 1-2. 던전 바닥 배경: 처음에 한 번만 큰 그림으로 만들어 두고, 매 프레임 그 한 장만 그림
    //   (타일 수백 장을 매번 그리면 느려지므로)
    // =====================================================================
    const FLOOR_PLAIN = "floor_plain";                        // 민무늬 바닥 (대부분)
    const FLOOR_EXTRAS = ["floor_holes", "floor_pebbles"];    // 구멍·자갈 바닥 (가끔 섞임)
    const FLOOR_TILE_SIZE = 48;      // 바닥 타일 한 칸 크기 (16픽셀 그림을 3배로)
    const FLOOR_EXTRA_CHANCE = 0.10; // 구멍·자갈 무늬가 나올 확률
    const FLOOR_EXTRA_ALPHA = 0.30;  // 구멍·자갈 무늬의 진하기 (너무 또렷하면 물체처럼 보여서 옅게 얹음)
    const BG_DIM = 0.62;             // 바닥을 어둡게 누르는 정도 (0~1). 올리면 공격·이펙트가 더 잘 보임

    let background = null;           // 완성된 배경 그림 (준비 전에는 null → 단색 배경이 보임)
    let vignetteLayer = null;        // 화면 가장자리를 어둡게 하는 막 (화면 크기, 한 번만 만듦)
    const floorImages = {};
    let floorLoaded = 0;
    for (const name of [FLOOR_PLAIN, ...FLOOR_EXTRAS, "wall"]) {
      const img = new Image();
      img.onload = () => {
        floorLoaded += 1;
        if (floorLoaded === 2 + FLOOR_EXTRAS.length) buildBackground();   // 전부 불러와지면 배경 만들기
      };
      img.src = `assets/${name}.png`;
      floorImages[name] = img;
    }

    function buildBackground() {
      const c = document.createElement("canvas");
      c.width = WORLD_W;
      c.height = WORLD_H;
      const b = c.getContext("2d");
      b.imageSmoothingEnabled = false;

      // (1) 바닥 타일 깔기: 민무늬 + 가끔 옅은 구멍·자갈 무늬 + 바둑판 음영
      for (let y = 0; y < WORLD_H; y += FLOOR_TILE_SIZE) {
        for (let x = 0; x < WORLD_W; x += FLOOR_TILE_SIZE) {
          b.drawImage(floorImages[FLOOR_PLAIN], x, y, FLOOR_TILE_SIZE, FLOOR_TILE_SIZE);

          // 가끔 구멍·자갈 무늬를 민무늬 위에 옅게 얹음
          if (Math.random() < FLOOR_EXTRA_CHANCE) {
            const name = FLOOR_EXTRAS[Math.floor(Math.random() * FLOOR_EXTRAS.length)];
            b.globalAlpha = FLOOR_EXTRA_ALPHA;
            b.drawImage(floorImages[name], x, y, FLOOR_TILE_SIZE, FLOOR_TILE_SIZE);
            b.globalAlpha = 1;
          }

          // 바둑판처럼 한 칸 걸러 아주 살짝 어둡게 → 타일 바닥 느낌
          if ((x / FLOOR_TILE_SIZE + y / FLOOR_TILE_SIZE) % 2 === 0) {
            b.fillStyle = "rgba(0, 0, 0, 0.10)";
            b.fillRect(x, y, FLOOR_TILE_SIZE, FLOOR_TILE_SIZE);
          }
        }
      }

      // (2) 어두운 남색 막을 덮어 바닥을 차분하게 누름 → 공격·이펙트·구슬이 묻히지 않게
      b.fillStyle = `rgba(18, 18, 32, ${BG_DIM})`;
      b.fillRect(0, 0, WORLD_W, WORLD_H);

      // (3) 맵 경계 돌담: 가장자리에 한 줄 (여기가 맵 끝이라는 표시)
      if (floorImages.wall) {
        for (let x = 0; x < WORLD_W; x += WALL_SIZE) {
          b.drawImage(floorImages.wall, x, 0, WALL_SIZE, WALL_SIZE);
          b.drawImage(floorImages.wall, x, WORLD_H - WALL_SIZE, WALL_SIZE, WALL_SIZE);
        }
        for (let y = 0; y < WORLD_H; y += WALL_SIZE) {
          b.drawImage(floorImages.wall, 0, y, WALL_SIZE, WALL_SIZE);
          b.drawImage(floorImages.wall, WORLD_W - WALL_SIZE, y, WALL_SIZE, WALL_SIZE);
        }
      }
      background = c;

      // (4) 비네트: 화면 크기로 따로 만들어 두고 매 프레임 맨 위에 덮음 (카메라가 움직여도 항상 화면 가장자리가 어둡게)
      const v = document.createElement("canvas");
      v.width = W;
      v.height = H;
      const vc = v.getContext("2d");
      const vignette = vc.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.75);
      vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
      vignette.addColorStop(1, "rgba(0, 0, 0, 0.55)");
      vc.fillStyle = vignette;
      vc.fillRect(0, 0, W, H);
      vignetteLayer = v;
    }

    // =====================================================================
    // 2. 게임 규칙 숫자들 (여기 값만 바꿔도 난이도 조절 가능)
    //    ※ 강화로 바뀌는 값은 "기본값"이고, 실제로는 player 안의 값을 씀
    // =====================================================================
    const PLAYER_SPEED = 220;        // 플레이어 기본 속도 (1초에 몇 픽셀)
    const PLAYER_RADIUS = 14;        // 플레이어 원의 반지름
    const PLAYER_MAX_HP = 120;       // 기본 최대 체력
    const INVINCIBLE_TIME = 0.8;     // 맞은 뒤 무적 시간 (초). 길수록 몰렸을 때 덜 아픔

    // --- 전체 난이도: 이 숫자 하나로 게임 전체가 쉬워지거나 어려워짐 (1 = 기본, 1.5 = 1.5배 어려움) ---
    //   모든 몬스터(꽃·미믹·엘리트·보스 포함)의 체력·피해, 보스 탄환 피해, 몬스터가 나오는 빈도에 곱해짐
    const DIFFICULTY = 1.5;

    // ※ 적의 속도·체력·피해는 아래 2-3번 구역 ENEMY_TYPES 표에 있음
    // --- 몬스터 생성 속도: 시간이 지날수록 빨라짐 ---
    //   생성 간격이 SPAWN_START 에서 시작해 SPAWN_RAMP_TIME 초에 걸쳐 SPAWN_MIN 까지 서서히 줄어듦
    //   그 뒤로는 한 번에 두 마리씩 나올 확률이 천천히 올라가서 후반에도 계속 압박이 커짐
    const SPAWN_START = 0.8;         // 처음 적 생성 간격 (초)
    const SPAWN_MIN = 0.25;          // 최소 생성 간격 (초)
    const SPAWN_RAMP_TIME = 600;     // 최소 간격에 도달하기까지 걸리는 시간 (초, 30분 기준 → 실제로는 BOSS_TIME 에 맞춰 줄어듦)
    const SPAWN_DOUBLE_TIME = 300;   // 최소 간격 도달 후, 한 번에 나오는 수가 +1 되기까지 걸리는 시간 (초, 30분 기준). 중반부터 5분마다 +1마리 → 마지막엔 한 번에 5마리
    const MAX_ENEMIES = 3000;        // 몬스터 수 제한은 사실상 없음. 이 값은 컴퓨터가 멈추는 것만 막는 안전장치 (측정: 2,500마리에서도 프레임당 3.5ms 로 여유)
    const WEAPON_LEVEL_DAMAGE = 0.2; // 무기를 1레벨 강화할 때마다 그 무기의 피해 +20%
    const MAX_WEAPONS = 6;           // 가질 수 있는 무기 수 (원작과 같음). 다 차면 '새 무기' 카드가 안 나옴

    const BULLET_SPEED = 450;        // 단검 속도
    const BULLET_RADIUS = 6;         // 단검이 맞는 범위 (그림 크기에 맞춰 4 → 6)

    // --- 경험치 / 레벨 ---
    const GEM_RADIUS = 6;            // 경험치 구슬 크기
    const PICKUP_RADIUS = 40;        // 구슬을 빨아들이는 거리 (기본값)
    // 필요 경험치 = XP_BASE + XP_GROWTH × (레벨-1) + XP_CURVE × (레벨-1)²
    //   → 10, 16, 24, 34, 46, 60 ... 갈수록 가파르게 늘어남
    const XP_BASE = 10;              // 1레벨 → 2레벨 필요 경험치
    const XP_GROWTH = 5;             // 레벨마다 늘어나는 양
    const XP_CURVE = 1;              // 레벨이 높을수록 더 가파르게 만드는 값
    const WEAPON_MAX_LEVEL = 8;      // 무기 최대 레벨 (원작과 같음)
    const GEM_PULL_SPEED = 150;      // 구슬이 끌려오기 시작할 때 속도 (px/초)
    const GEM_PULL_ACCEL = 900;      // 끌려오는 구슬이 1초마다 빨라지는 양
    const MAGNET_MAX = 5;            // 자석(패시브)의 최대 레벨 (원작과 같음)
    const START_CHOICES = 3;         // 레벨업 카드 수 (처음)
    const MAX_CHOICES = 5;           // 레벨업 카드 수 (최대)
    const PASSIVE_MAX_SLOTS = 6;     // 가질 수 있는 패시브 아이템 수 (원작과 같음). '선택의 폭'은 자리를 차지하지 않음

    // =====================================================================
    // 2-1. 무기 목록 (새 무기를 추가하려면 여기에 항목 하나 더)
    //   name        : 카드에 보이는 이름
    //   desc        : '새 무기' 카드에 보이는 한 줄 설명 (어떻게 공격하는지)
    //   interval    : 발동 간격 (초). 0이면 "항상 켜짐"
    //   upgradeDesc : 강화 카드 설명
    //   fire(w)     : 간격마다 한 번 실행 (탄환 쏘기 등)
    //   update(w,dt): 매 프레임 실행 (회전 도끼처럼 계속 움직이는 것)
    //   draw(w)     : 화면에 그리기 (플레이어에 붙어 있는 무기용)
    //   icon        : 보유 목록·카드에 표시할 그림 이름 (assets 폴더. 몬스터·무기는 Tiny Dungeon, 나머지는 1-Bit Pack 에 색을 입힘)
    //   w.level     : 이 무기의 현재 레벨 (1~WEAPON_MAX_LEVEL, 원작처럼 8)
    // =====================================================================
    const WEAPONS = {
      // --- 단검: 바라보는 방향으로 빠르게 연사 (원작 Knife). 레벨 = 단검 개수 ---
      bullet: {
        name: "단검",
        desc: "바라보는 방향으로 단검을 빠르게 연사",
        icon: "dagger",
        interval: 0.35,
        upgradeDesc: "단검 +1자루, 피해 +20%",
        fire(w) {
          const dirX = player.facingX, dirY = player.facingY;
          const count = w.level;
          for (let i = 0; i < count; i++) {
            // 여러 자루면 진행 방향의 옆으로 나란히 (12px 간격)
            const side = (i - (count - 1) / 2) * 12;
            bullets.push({
              kind: "bullet", sprite: "dagger", size: 16,
              x: player.x - dirY * side, y: player.y + dirX * side,
              vx: dirX * BULLET_SPEED, vy: dirY * BULLET_SPEED,
              r: BULLET_RADIUS,
              damage: weaponDamage(w),
            });
          }
        },
      },

      // --- 마법봉: 가장 가까운 적에게 마법탄 (원작 Magic Wand). Lv3·5·7 마법탄 +1, Lv2·4·6·8 간격 -10% ---
      wand: {
        name: "마법봉",
        desc: "가장 가까운 적에게 마법탄을 자동 발사",
        icon: "wand",
        interval: 0.75,
        upgradeDesc: "마법탄 +1 / 간격 -10% (번갈아), 피해 +20%",
        getInterval(w) { return this.interval * Math.pow(0.9, Math.floor(w.level / 2)); },
        fire(w) {
          const target = findNearestEnemy();
          if (!target) return;
          const baseAngle = Math.atan2(target.y - player.y, target.x - player.x);
          const count = 1 + Math.floor((w.level - 1) / 2);
          for (let i = 0; i < count; i++) {
            const angle = baseAngle + (i - (count - 1) / 2) * 0.18;
            bullets.push({
              kind: "magic", color: "#7df9ff",
              x: player.x, y: player.y,
              vx: Math.cos(angle) * 420, vy: Math.sin(angle) * 420,
              r: 6,
              damage: weaponDamage(w, 0.5),
            });
          }
        },
      },

      // --- 검 휘두르기: 바라보는 방향 앞을 가로로 벰 (원작 Whip). Lv2·4·6·8 베기 +1(뒤, 위), Lv3·5·7 범위 +20% ---
      sword: {
        name: "검 휘두르기",
        desc: "바라보는 방향 앞을 크게 베고 적을 밀어냄",
        icon: "sword",
        interval: 1.1,
        upgradeDesc: "베기 +1 / 범위 +20% (번갈아), 피해 +20%",
        noAmount: true,                                  // 복제기 영향 없음 (원작과 같음)
        getRadius(w) { return 70 * Math.pow(1.2, Math.floor((w.level - 1) / 2)) * areaMul(); },
        fire(w) {
          const strikes = w.level >= 4 ? 3 : w.level >= 2 ? 2 : 1;
          const f = { x: player.facingX, y: player.facingY };
          const dirs = [f, { x: -f.x, y: -f.y }, { x: 0, y: -1 }];        // 앞 → 뒤 → 위
          this.slash(w, dirs[0]);                                       // 첫 베기는 바로
          w.pending = w.pending || [];
          for (let i = 1; i < strikes; i++) w.pending.push({ delay: i * 0.15, dir: dirs[i] });   // 나머지는 0.15초씩 뒤에
        },
        update(w, dt) {
          if (!w.pending) return;
          for (const p of w.pending) {
            p.delay -= dt;
            if (p.delay <= 0) { this.slash(w, p.dir); p.done = true; }
          }
          w.pending = w.pending.filter((p) => !p.done);
        },
        // 한 방향으로 실제로 베기: 그 방향 앞쪽 반원 안의 적에게 피해 + 밀어냄
        slash(w, dir) {
          const r = this.getRadius(w);
          for (const e of enemies) {
            if (e.dead) continue;
            const dx = e.x - player.x, dy = e.y - player.y;
            const dist = Math.hypot(dx, dy);
            if (dist < r + e.r && dx * dir.x + dy * dir.y > 0) {
              damageEnemy(e, weaponDamage(w, 1));
              pushEnemy(e, player.x, player.y, 30);
            }
          }
          effects.push({ kind: "slash", x: player.x, y: player.y, angle: Math.atan2(dir.y, dir.x), r, life: 0.2, maxLife: 0.2 });
        },
      },

      // --- 회전 도끼: 플레이어 주위를 도는 양날 도끼, 레벨 = 도끼 개수 ---
      orb: {
        name: "회전 도끼",
        desc: "주위를 도는 도끼가 닿는 적을 계속 타격",
        icon: "axe",
        interval: 0,
        upgradeDesc: "도끼 +1개, 피해 +20% (Lv3·5·7 회전 +20%)",
        orbitRadius: 60,       // 플레이어와의 거리
        orbRadius: 11,         // 도끼가 맞는 범위 (그림 크기에 맞춤)
        rotateSpeed: 3,        // 1초에 도는 각도 (라디안). Lv3·5·7 에서 +20%
        hitCooldown: 0.3,      // 같은 적을 다시 때리기까지 시간
        update(w, dt) {
          w.angle = (w.angle || 0) + this.rotateSpeed * Math.pow(1.2, Math.floor((w.level - 1) / 2)) * projSpeedMul() * dt;
          for (const pos of this.positions(w)) {
            for (const e of enemies) {
              if (e.dead || (e.cd.orb || 0) > 0) continue;
              if (circlesTouch({ x: pos.x, y: pos.y, r: this.orbRadius }, e)) {
                damageEnemy(e, weaponDamage(w));
                e.cd.orb = this.hitCooldown;
              }
            }
          }
        },
        // 구체들의 현재 위치 (360도를 개수만큼 균등 분할). 개수 = 레벨 + 복제기, 거리 = 기본 × 촛대
        positions(w) {
          const list = [];
          const count = w.level + extraAmount() + (this.extraCount || 0);   // 진화하면 extraCount 만큼 더
          const radius = this.orbitRadius * areaMul();
          for (let i = 0; i < count; i++) {
            const a = (w.angle || 0) + (Math.PI * 2 * i) / count;
            list.push({ x: player.x + Math.cos(a) * radius,
                        y: player.y + Math.sin(a) * radius });
          }
          return list;
        },
        draw(w) {
          const spin = stats.time * 10;            // 도끼가 제자리에서 빙글빙글 도는 각도
          for (const pos of this.positions(w)) {
            // 하늘색 빛 (내 공격 표시)
            ctx.fillStyle = "rgba(125, 249, 255, 0.22)";
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, this.orbRadius * 1.5, 0, Math.PI * 2);
            ctx.fill();
            if (!drawSprite("axe", pos.x, pos.y, 16, { angle: spin })) {
              ctx.fillStyle = "#caf0f8";           // 그림이 없을 때: 하늘색 원
              ctx.beginPath();
              ctx.arc(pos.x, pos.y, this.orbRadius, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        },
      },

      // --- 관통 창: 직선으로 날아가며 적을 뚫고 지나감, 레벨↑ = 발사 간격↓ ---
      spear: {
        name: "관통 창",
        desc: "가장 가까운 적 쪽으로 적을 뚫고 지나가는 창",
        icon: "spear",
        interval: 1.5,
        upgradeDesc: "발사 간격 -25%, 피해 +20%",
        getInterval(w) { return this.interval * Math.pow(0.75, w.level - 1); },
        fire(w) {
          const target = findNearestEnemy();
          if (!target) return;
          const dx = target.x - player.x, dy = target.y - player.y;
          const len = Math.hypot(dx, dy) || 1;
          bullets.push({
            kind: "spear", sprite: "spear", size: 21,
            x: player.x, y: player.y,
            vx: (dx / len) * 600, vy: (dy / len) * 600,
            r: 6,
            damage: weaponDamage(w, 1),
            pierce: 99,               // 계속 뚫고 지나감
            hitIds: new Set(),        // 이미 때린 적 번호 (같은 적 두 번 안 때림)
          });
        },
      },

      // --- 번개 오라: 플레이어 주변 원 안의 적에게 주기적으로 피해, 레벨↑ = 반경↑ ---
      aura: {
        name: "번개 오라",
        desc: "주변 원 안의 적에게 계속 피해를 주고 살짝 밀어냄",
        icon: "w_aura",
        interval: 0.5,
        upgradeDesc: "범위 +20, 피해 +20%",
        noAmount: true,                                  // 복제기 영향 없음 (원작과 같음)
        getRadius(w) { return (60 + 20 * (w.level - 1)) * areaMul(); },
        fire(w) {
          const r = this.getRadius(w);
          for (const e of enemies) {
            if (!e.dead && Math.hypot(e.x - player.x, e.y - player.y) < r + e.r) {
              damageEnemy(e, weaponDamage(w));
              pushEnemy(e, player.x, player.y, 10);   // 살짝 밀어냄 (원작 Garlic 의 넉백)
            }
          }
          w.flash = 0.15;   // 번쩍이는 연출용 (초)
        },
        update(w, dt) {
          if (w.flash > 0) w.flash -= dt;
          // 번개 줄기 모양을 0.08초마다 새로 만듦 (지직거리는 느낌)
          w.boltTimer = (w.boltTimer || 0) - dt;
          if (w.boltTimer <= 0) {
            w.boltTimer = 0.08;
            w.bolts = [];
            const r = this.getRadius(w);
            for (let i = 0; i < 5; i++) {
              const a = Math.random() * Math.PI * 2;
              const points = [];
              for (let step = 0; step <= 4; step++) {
                const dist = r * (0.3 + 0.7 * (step / 4));
                const jitter = a + (Math.random() - 0.5) * 0.7;
                points.push({ dx: Math.cos(jitter) * dist, dy: Math.sin(jitter) * dist });
              }
              w.bolts.push(points);
            }
          }
        },
        draw(w) {
          const r = this.getRadius(w);
          const active = w.flash > 0;              // 피해를 준 직후엔 더 밝게
          ctx.fillStyle = active ? "rgba(120, 200, 255, 0.30)" : "rgba(120, 200, 255, 0.10)";
          ctx.strokeStyle = active ? "rgba(125, 249, 255, 0.9)" : "rgba(125, 249, 255, 0.45)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(player.x, player.y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // 번개 줄기
          ctx.strokeStyle = active ? "rgba(225, 252, 255, 0.95)" : "rgba(200, 245, 255, 0.45)";
          ctx.lineWidth = active ? 2 : 1;
          for (const points of w.bolts || []) {
            ctx.beginPath();
            points.forEach((pt, i) => {
              if (i === 0) ctx.moveTo(player.x + pt.dx, player.y + pt.dy);
              else ctx.lineTo(player.x + pt.dx, player.y + pt.dy);
            });
            ctx.stroke();
          }
        },
      },

      // --- 화염병: 무작위 적 근처에 던져 바닥에 불바다를 남김 (원작 Santa Water). Lv3·5·7 병 +1, Lv2·4·6·8 크기·시간 +20% ---
      bomb: {
        name: "화염병",
        desc: "적 근처에 던져 바닥에 불바다를 남김",
        icon: "firebomb",
        interval: 3.0,
        upgradeDesc: "불바다 크기·시간 +20% (짝수 레벨), 병 +1 (Lv4·7), 피해 +20%",
        getScale(w) { return Math.pow(1.2, Math.floor(w.level / 2)); },
        fire(w) {
          const count = 1 + Math.floor((w.level - 1) / 3);          // 병: Lv1~3 1개, Lv4~6 2개, Lv7~8 3개
          const targets = enemies.filter((e) => !e.dead && inView(e.x, e.y));
          for (let i = 0; i < count; i++) {
            // 목표: 화면 안 무작위 적 근처 (적이 없으면 플레이어 근처 아무 데나)
            const t = targets.length ? targets[Math.floor(Math.random() * targets.length)] : { x: player.x + (Math.random() - 0.5) * 300, y: player.y + (Math.random() - 0.5) * 300 };
            const tx = t.x + (Math.random() - 0.5) * 40, ty = t.y + (Math.random() - 0.5) * 40;
            const dx = tx - player.x, dy = ty - player.y;
            const len = Math.hypot(dx, dy) || 1;
            bullets.push({
              kind: "bomb", sprite: "firebomb", size: 16, spin: 14, noHit: true,
              x: player.x, y: player.y,
              vx: (dx / len) * 300, vy: (dy / len) * 300,
              r: 7,
              targetX: tx, targetY: ty,                  // 여기 도착하면 불바다
              zoneRadius: 55 * this.getScale(w) * areaMul(),
              zoneLife: 3 * this.getScale(w) * durationMul(),
              damage: weaponDamage(w) * 0.3,             // 0.25초마다 이만큼 (불바다는 겹치므로 낮게)
            });
          }

      shield: {

      shadow: {

      dusting: {

      victory: {
        name: "승리의 검", icon: "bigsword", iconMark: "v",

        retaliate(w) {
          const r = 90 * areaMul();

      // --- 화염 방사: 바라보는 방향으로 부채꼴 불길 (원작 Flames of Misspell). Lv3·5 부채꼴 +1(뒤), Lv2·4 범위 +20% ---
      flames: {

    // 지금 이동 키를 누르고 있는지 (그림자 발톱, 성풍, 꽃가루가 씀)
    function isMoving() {
      return !!(keys["w"] || keys["a"] || keys["s"] || keys["d"] || keys["arrowup"] || keys["arrowdown"] || keys["arrowleft"] || keys["arrowright"]);
    }

    // =====================================================================
    // 2-1-1. 진화: 무기가 최대 레벨이고 짝이 되는 패시브도 최대 레벨인 채 보물 상자를 열면 진화
    //   EVOLUTIONS[기본 무기] = { to: 진화 무기, needs: 패시브 }  ← 무기 만렙 + 그 패시브 만렙이어야 함
    //   진화 무기는 레벨이 없고(항상 최대), 더 강화되지 않으며, '새 무기' 카드로는 나오지 않음
    //   진화 무기 정의는 기본 무기를 복사한 뒤 일부만 덮어씀 (같은 그림을 씀)
    // =====================================================================
    const EVOLUTIONS = {
      sword:     { to: "sword_evo",     needs: "maxhp" },

      bullet:    { to: "bullet_evo",    needs: "projspeed" },

      bomb:      { to: "bomb_evo",      needs: "magnet" },
      rune:      { to: "rune_evo",      needs: "armor" },
      lightning: { to: "lightning_evo", needs: "amount" },

      spear:     { to: "spear_evo",     needs: "projspeed" },
    };
    function evolvedDef(base, overrides) {
      return Object.assign({}, WEAPONS[base], { evolved: true, evoOf: base }, overrides);
    }
    Object.assign(WEAPONS, {
      sword_evo: evolvedDef("sword", { name: "피의 검", desc: "3연속 베기. 벨 때마다 체력 1 회복", damageMul: 2.0,
        fire(w) { this.slash(w, { x: player.facingX, y: player.facingY }); w.pending = [{ delay: 0.12, dir: { x: -player.facingX, y: -player.facingY } }, { delay: 0.24, dir: { x: 0, y: -1 } }]; },
        slash(w, dir) {
          const r = this.getRadius(w); let hits = 0;
          for (const e of enemies) { if (e.dead) continue; const dx = e.x - player.x, dy = e.y - player.y; if (Math.hypot(dx, dy) < r + e.r && dx * dir.x + dy * dir.y > 0) { damageEnemy(e, weaponDamage(w, 1)); pushEnemy(e, player.x, player.y, 30); hits++; } }
          if (hits > 0) player.hp = Math.min(player.maxHp, player.hp + hits);
          effects.push({ kind: "slash", x: player.x, y: player.y, angle: Math.atan2(dir.y, dir.x), r, life: 0.2, maxLife: 0.2 });
        } }),
      wand_evo: evolvedDef("wand", { name: "성스러운 봉", desc: "쉬지 않고 마법탄을 쏨", interval: 0.2, damageMul: 1.2 }),
      bullet_evo: evolvedDef("bullet", { name: "천 개의 칼날", desc: "단검이 폭포처럼 쏟아짐", interval: 0.09 }),
      hammer_evo: evolvedDef("hammer", { name: "죽음의 나선", desc: "망치 8개가 사방으로 회전하며 날아감", interval: 1.3,
        fire(w) { for (let i = 0; i < 8; i++) { const a = (Math.PI * 2 * i) / 8 + stats.time; bullets.push({ kind: "hammer", sprite: "hammer", size: 17, spin: 10, margin: 200, x: player.x, y: player.y, vx: Math.cos(a) * 330, vy: Math.sin(a) * 330, r: 12, damage: weaponDamage(w) * 2 * Math.pow(1.3, Math.floor(w.level / 2)), pierce: 99, hitIds: new Set(), life: 2.5 }); } } }),
      cross_evo: evolvedDef("cross", { name: "천상의 검", desc: "더 많이, 더 빠르게 돌아오는 방패", interval: 1.4, damageMul: 1.8 }),
      orb_evo: evolvedDef("orb", { name: "부정한 저녁기도", desc: "도끼 +2개가 더 빠르게 돎", extraCount: 2, rotateSpeed: 4.5, damageMul: 1.8 }),
      firewand_evo: evolvedDef("firewand", { name: "지옥불", desc: "거대한 화염구를 연달아 쏨", interval: 1.4, damageMul: 2 }),
      aura_evo: evolvedDef("aura", { name: "영혼 포식자", desc: "더 넓은 오라. 맞힌 적마다 체력 0.5 회복", damageMul: 2,
        getRadius(w) { return (60 + 20 * (w.level - 1)) * 1.5 * areaMul(); },
        fire(w) { const r = this.getRadius(w); let hits = 0; for (const e of enemies) { if (!e.dead && Math.hypot(e.x - player.x, e.y - player.y) < r + e.r) { damageEnemy(e, weaponDamage(w)); pushEnemy(e, player.x, player.y, 10); hits++; } } if (hits) player.hp = Math.min(player.maxHp, player.hp + 0.5 * hits); w.flash = 0.15; } }),
      bomb_evo: evolvedDef("bomb", { name: "성수의 늪", desc: "불바다가 더 크고 오래가며 나를 따라옴", damageMul: 1.2,
        fire(w) { const before = bullets.length; WEAPONS.bomb.fire.call(this, w); for (let i = before; i < bullets.length; i++) { bullets[i].zoneRadius *= 1.25; bullets[i].zoneLife *= 1.5; bullets[i].zoneFollow = true; } } }),
      rune_evo: evolvedDef("rune", { name: "미래 없음", desc: "구슬이 오래 튕기고, 튕길 때마다 폭발", damageMul: 1.5,
        fire(w) { const before = bullets.length; WEAPONS.rune.fire.call(this, w); for (let i = before; i < bullets.length; i++) { const b = bullets[i]; b.life *= 2; b.onBounce = (x) => { const r = 60 * areaMul(); for (const e of enemies) if (!e.dead && Math.hypot(e.x - x.x, e.y - x.y) < r + e.r) damageEnemy(e, x.damage); effects.push({ x: x.x, y: x.y, r, life: 0.25, maxLife: 0.25 }); }; } } }),
      lightning_evo: evolvedDef("lightning", { name: "천둥 고리", desc: "번개가 두 번씩 내리침", damageMul: 1.3,

      staff_evo: evolvedDef("staff", { name: "마나의 폭풍", desc: "가로줄과 세로줄에 동시에 두 배 굵은 광선", damageMul: 1.4,
        getHalfWidth(w) { return 22 * Math.pow(1.3, w.level - 1) * 2 * areaMul(); },
        fire(w) { const half = this.getHalfWidth(w); const onScreen = enemies.filter((e) => !e.dead && inView(e.x, e.y)); for (const horizontal of [true, false]) { let best = null; for (const c of onScreen) { const line = { horizontal, pos: horizontal ? c.y : c.x }; let count = 0; for (const e of onScreen) if (isInLine(e, line, half)) count++; if (!best || count > best.count) best = { ...line, count }; } if (!best) continue; for (const e of enemies) if (!e.dead && isInLine(e, best, half)) damageEnemy(e, weaponDamage(w, 1)); effects.push({ kind: "beam", horizontal: best.horizontal, pos: best.pos, half, life: 0.35, maxLife: 0.35 }); } } }),
      clock_evo: evolvedDef("clock", { name: "무한 회랑", desc: "4방향 광선. 얼린 적의 체력을 30% 깎음",
        fire(w) { w.dir = ((w.dir || 0) + 1) % 12; const freezeFor = 5 * durationMul(); for (let k = 0; k < 4; k++) { const a = (w.dir / 12) * Math.PI * 2 + (k * Math.PI) / 2; const ux = Math.cos(a), uy = Math.sin(a); for (const e of enemies) { if (e.dead || e.boss) continue; const dx = e.x - player.x, dy = e.y - player.y; const along = dx * ux + dy * uy, across = Math.abs(dx * uy - dy * ux); if (along > 0 && along < this.rayLength && across < this.rayHalf + e.r) { e.frozenTimer = freezeFor; damageEnemy(e, Math.ceil(e.maxHp * 0.3)); } } effects.push({ kind: "ray", x: player.x, y: player.y, angle: a, len: this.rayLength, half: this.rayHalf, life: 0.3, maxLife: 0.3 }); } } }),
      shield_evo: evolvedDef("shield", { name: "진홍 장막", desc: "3초마다 다시 생기고, 깨질 때 주위 적을 밀어내며 피해",
        getRecharge(w) { return 3; },
        breakShield(w) { WEAPONS.shield.breakShield.call(this, w); const r = 120; for (const e of enemies) if (!e.dead && Math.hypot(e.x - player.x, e.y - player.y) < r + e.r) { damageEnemy(e, 20 * damageMul()); pushEnemy(e, player.x, player.y, 60); } } }),
      spear_evo: evolvedDef("spear", { name: "폭풍의 창", desc: "창 3개를 더 빠르게 던짐", damageMul: 1.0,
        getInterval(w) { return WEAPONS.spear.getInterval.call(this, w) * 0.7; },
        fire(w) { const target = findNearestEnemy(); if (!target) return; const base = Math.atan2(target.y - player.y, target.x - player.x); for (let i = -1; i <= 1; i++) { const a = base + i * 0.25; bullets.push({ kind: "spear", sprite: "spear", size: 21, x: player.x, y: player.y, vx: Math.cos(a) * 600, vy: Math.sin(a) * 600, r: 6, damage: weaponDamage(w, 1), pierce: 99, hitIds: new Set() }); } } }),
    });
    for (const base in EVOLUTIONS) { WEAPONS[base].evolvesTo = EVOLUTIONS[base].to; WEAPONS[base].needs = EVOLUTIONS[base].needs; }

    // =====================================================================
    // 2-2. 패시브 아이템 목록 (원작 뱀파이어 서바이벌의 패시브. 무기처럼 Lv1~maxLevel, 카드와 상자에서 강화)
    //   name     : 카드에 보이는 이름        icon : assets 폴더의 그림 이름
    //   maxLevel : 최대 레벨                 desc : 카드 설명 (레벨당 효과)
    //   noSlot   : true 면 패시브 슬롯(6칸)을 차지하지 않음
    //   효과는 여기 적지 않고, 아래 passiveLevel()/recalcStats()/각 ×Mul() 함수가 레벨을 읽어서 적용함
    //   → 레벨업 카드로 올리든 상자에서 올리든 계산이 어긋나지 않음
    // =====================================================================
    const PASSIVES = {
      might:     { name: "힘",        icon: "passive_might",     maxLevel: 5, desc: "무기 피해 +10%" },
      armor:     { name: "갑옷",      icon: "passive_armor",     maxLevel: 3, desc: "받는 피해 -1" },
      maxhp:     { name: "튼튼함",    icon: "passive_maxhp",     maxLevel: 3, desc: "최대 체력 +20%" },

    const P_AREA = 0.10;        // 촛대: 범위 +10%

    // 가진 패시브의 레벨 (없으면 0)
    function passiveLevel(key) {
      const p = player.passives.find((it) => it.type === key);
      return p ? p.level : 0;
    }
    // 무기 계산 때 그때그때 읽는 배수들
    function damageMul()    { return 1 + P_MIGHT * passiveLevel("might"); }
    function areaMul()      { return 1 + P_AREA * passiveLevel("area"); }
    function projSpeedMul() { return 1 + P_PROJSPEED * passiveLevel("projspeed"); }
    function durationMul()  { return 1 + P_DURATION * passiveLevel("duration"); }
    function extraAmount()  { return passiveLevel("amount"); }
    function luckMul()      { return 1 + P_LUCK * passiveLevel("luck"); }
    function xpMul()        { return 1 + P_GROWTH * passiveLevel("growth"); }
    function curseLevel()   { return passiveLevel("curse"); }

    // 패시브 레벨이 바뀔 때마다 플레이어의 능력치를 '기본값 × 레벨'로 다시 계산
    //   (누적 곱셈 대신 매번 새로 계산하므로 어디서 올려도 값이 정확함)
    function recalcStats() {
      const oldMax = player.maxHp;
      player.maxHp = Math.round(PLAYER_MAX_HP * (1 + P_MAXHP * passiveLevel("maxhp")));
      if (player.maxHp > oldMax) player.hp += player.maxHp - oldMax;   // 최대 체력이 오른 만큼 현재 체력도 +
      player.hp = Math.min(player.hp, player.maxHp);
      player.speed = PLAYER_SPEED * (1 + P_MOVE * passiveLevel("move"));
      player.attackSpeed = 1 - P_COOLDOWN * passiveLevel("cooldown");
      player.pickupRadius = PICKUP_RADIUS + P_MAGNET * passiveLevel("magnet");
      player.choices = START_CHOICES + passiveLevel("choices");
    }

      const owned = player.passives.find((it) => it.type === key);
      if (owned) owned.level += 1;
      else player.passives.push({ type: key, level: 1 });
      recalcStats();

    //   type   : 떼의 몬스터 종류          count : 한 떼의 마릿수 (없으면 SWARM_COUNT 규칙)   life : 꽃이 버티는 시간 (초)
    //   delay 가 3초보다 짧으면 같은 방향으로 줄지어 나와 "강물"처럼 흐르고, 길면 매번 다른 방향에서 나옴
    const EVENT_SCHEDULE = [

    // --- 보물 상자: 열면 게임이 멈추고, 룰렛이 돈 뒤 가진 무기·능력이 자동으로 강화됨 ---

    const CHEST_ROLL_TIME = 1.5;         // 룰렛이 도는 시간 (초)
    // 상자 하나에서 나오는 강화 개수. weight = 나올 비중 (더하면 100 → % 로 읽으면 됨)
    const CHEST_COUNTS = [

    // --- 바닥 아이템: 몬스터가 낮은 확률로 떨어뜨림. 닿으면 바로 발동 (구슬처럼 끌려오지는 않음) ---
    const ITEM_DROP_CHANCE = 0.008;      // 몬스터를 잡을 때 아이템이 떨어질 확률 (0.8%). 클로버(패시브)가 있으면 더 자주
    const ITEM_LIFETIME = 30;            // 아이템이 남아 있는 시간 (초)

      // 그림만 봐도 뭔지 알 수 있게: 회복 = 초록 물약, 자석 = 말굽자석, 전멸 = 해골, 빙결 = 눈꽃

    // --- 미믹: 보물 상자인 척하는 몬스터 ---
    //   20레벨부터, 떨어지는 상자 중 일부가 미믹. 닿으면 보상 대신 몬스터로 변해 덤벼듦
    //   화면 위 안내 문구는 띄우지 않음 (몰래 섞여 나오는 게 재미)
    //   구별법: 미믹 상자는 몇 초에 한 번씩 살짝 떨림
    //   보상: 미믹을 잡으면 진짜 상자를 반드시 떨어뜨림
    const MIMIC_MIN_LEVEL = 20;          // 이 레벨부터 미믹이 섞여 나옴
    const MIMIC_CHANCE = 0.25;           // 상자가 미믹일 확률 (25%)
    const MIMIC_WAKE_TIME = 0.6;         // 정체를 드러낸 뒤 움직이기까지 걸리는 시간 (초). 이동안은 닿아도 피해 없음
    const MIMIC_TYPE = { key: "mimic", name: "미믹", shape: "mimic", color: "#c8793f", r: 15, speed: 95, hp: 12, damage: 15, xp: 8, behavior: "chase" };

    // --- 이펙트 (보기 좋으라고 넣는 연출, 게임 규칙에는 영향 없음) ---
    const HIT_FLASH_TIME = 0.08;         // 맞은 적이 흰색으로 번쩍이는 시간 (초)
    const HIT_SPARKS = 3;                // 맞을 때 튀는 불꽃 수
    const DEATH_PARTICLES = 10;          // 죽을 때 퍼지는 파편 수
    const PARTICLE_MAX = 300;            // 화면에 동시에 있을 수 있는 파편 최대 수 (너무 많으면 느려짐)
    const BULLET_TRAIL = 0.04;           // 탄환 꼬리 길이 (초 단위: 이 시간 동안 날아온 거리만큼)

    // =====================================================================
    // 3. 게임이 기억해야 할 것들 (상태)
    // =====================================================================
    let player;        // 플레이어 정보 (위치, 체력, 레벨, 무기, 패시브 등)
    let enemies;       // 적 목록
    let pendingSpawns; // 이번 프레임에 새로 생긴 적 (거미의 새끼). 프레임 끝에 enemies에 합침
    let enemyBullets;  // 마법사가 쏜 탄환 목록
    let banner;        // 화면 위 안내 문구 { text, life }
    let bullets;       // 발사체 목록 (탄환, 창, 폭탄 모두 여기)
    let gems;          // 경험치 구슬 목록
    let chests;        // 바닥에 떨어진 보물 상자 목록

    let zones;         // 바닥에 남아 피해를 주는 지역 목록 (화염병 불바다 등)
    let eliteTimer;    // 다음 엘리트가 나올 때까지 남은 시간
    let eventIndex;    // 이벤트 시간표에서 다음에 확인할 칸

    let boss;          // 마지막 보스 (나타나기 전에는 null)

    let chestRoll;     // 상자 룰렛 진행 정보 (열려 있지 않으면 null)

    let effects;       // 폭발·고리 같은 잠깐 보이는 연출 목록
    let particles;     // 작은 파편 목록 (피격 불꽃, 처치 파편)
    let stats;         // 생존 시간, 처치 수

    let spawnTimer;    // 다음 적 생성까지 남은 시간
    let lastTime;      // 이전 프레임 시각 (dt 계산용)
    let nextEnemyId;   // 적마다 붙이는 고유 번호

    const keys = {};   // 지금 눌려 있는 키 목록. 예: keys["w"] === true

    // =====================================================================
    // 4. 처음 상태로 되돌리기 (시작할 때 + 재시작할 때 호출)
    // =====================================================================
    function resetGame() {
      player = {
        x: WORLD_W / 2,           // 맵 한가운데에서 시작
        y: WORLD_H / 2,

        facingLeft: false,        // 왼쪽을 보고 있는지 (그림 좌우 뒤집기용)
        facingX: 1, facingY: 0,   // 바라보는 방향 (마지막 이동 방향, 길이 1). 단검·검 휘두르기가 씀
        // --- 강화로 바뀌는 값들 ---
        speed: PLAYER_SPEED,
        damage: 1,
        attackSpeed: 1,           // 발동 간격에 곱함 (작을수록 빠름)

        passives: [],

        enemyStage: 0,            // 지금 몬스터 단계 (시간표에서 몇 번째 칸인지)
        // --- 무기: 시작은 마법봉(자동 조준)만. 단검은 바라보는 방향으로만 나가서 시작 무기로는 어려움 ---

      enemies = [];

      enemyBullets = [];
      banner = null;
      bullets = [];

      chests = [];

      eventIndex = 0;
      eventQueue = [];
      boss = null;
      freezeTimer = 0;
      cancelChestRoll();
      floatTexts = [];
      effects = [];
      particles = [];
      stats = { time: 0, kills: 0 };
      state = "playing";
      spawnTimer = SPAWN_START;
